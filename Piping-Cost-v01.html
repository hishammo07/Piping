<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073A47">
<title>Pipe &amp; Valve Cost Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --navy-950:#0B1220; --navy-900:#101B30; --navy-800:#1B2C48; --navy-700:#28406A; --navy-line:#33507C;
    --brass-300:#F0C48A; --brass-500:#D69A4E; --brass-600:#B67B33; --steel-500:#5B95A0; --steel-300:#8FC2CB;
    --amber-500:#D69A4E; --amber-600:#B67B33; --teal-500:#5B95A0;
    --paper:#F7F2E9; --panel:#FFFFFF; --ink:#1B2434; --ink-soft:#63707E;
    --line:#E7E0D2; --line-soft:#F1ECE1;
    --mono: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --display: 'Archivo', 'Segoe UI', system-ui, sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--ink);font-family:var(--sans);
    background:
      radial-gradient(900px 500px at 8% -8%, rgba(214,154,78,.10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(91,149,160,.12), transparent 55%),
      repeating-linear-gradient(0deg, rgba(27,44,72,.025) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(90deg, rgba(27,44,72,.025) 0 1px, transparent 1px 30px),
      var(--paper);
  }
  .app{max-width:1500px;margin:0 auto;padding:24px 20px 60px;}

  /* ---------- Header: soft instrument panel ---------- */
  .topbar{
    display:flex;flex-direction:column;gap:0;
    border-radius:var(--r-lg);color:#fff;
    background:
      radial-gradient(600px 260px at 12% 0%, rgba(214,154,78,.16), transparent 60%),
      radial-gradient(600px 300px at 100% 100%, rgba(91,149,160,.18), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 40%),
      var(--navy-950);
    box-shadow:0 14px 34px rgba(11,18,32,.28);
    position:relative;overflow:hidden;
    border:1px solid var(--navy-line);
  }
  .topbar::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(240,196,138,.05) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(240,196,138,.05) 0 1px, transparent 1px 24px);
    -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.2));
            mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.2));
  }
  .topbar-main{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:22px 28px 20px;position:relative;z-index:1;}
  .corner-tick{display:none;}
  .brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .brand-mark{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25));}
  .brand-text .eyebrow{display:block;font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--brass-300);margin-bottom:3px;}
  .brand-text h1{margin:0;font-family:var(--display);font-size:24px;letter-spacing:2px;color:#fff;font-weight:700;text-transform:uppercase;}
  .brand-text .subtitle{font-size:12px;color:rgba(255,255,255,.68);letter-spacing:.2px;}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:1;}

  .btn{
    border:1px solid var(--navy-line);background:rgba(255,255,255,.05);
    color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    font-family:var(--display);letter-spacing:.6px;text-transform:uppercase;
  }
  .btn svg{width:15px;height:15px;flex:none;}
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.2);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg, var(--brass-300), var(--brass-500));color:var(--navy-950);border-color:var(--brass-500);}
  .btn.primary:hover{background:linear-gradient(135deg, var(--brass-300), var(--brass-300));box-shadow:0 8px 18px rgba(214,154,78,.35);}

  /* ---------- signature: animated pipeline flow-line ---------- */
  .flow-rail{position:relative;height:20px;z-index:1;padding:0 28px;overflow:hidden;}
  .flow-rail .rail-line{position:absolute;left:28px;right:28px;top:9px;height:2px;background:var(--navy-line);}
  .flow-rail .rail-node{position:absolute;top:5px;width:10px;height:10px;border-radius:50%;background:var(--navy-950);border:2px solid var(--brass-500);transform:translateX(-50%);}
  .flow-rail .rail-pulse{
    position:absolute;top:8px;height:4px;width:160px;border-radius:2px;
    background:linear-gradient(90deg, rgba(227,181,122,0), var(--brass-300) 45%, var(--brass-500) 55%, rgba(227,181,122,0));
    animation:flowPulse 5s linear infinite;
  }
  @keyframes flowPulse{
    0%{left:-160px;}
    100%{left:100%;}
  }
  @media (prefers-reduced-motion: reduce){
    .flow-rail .rail-pulse{animation:none;display:none;}
  }

  /* ---------- Summary cards ---------- */
  .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 20px;}
  .summary-card{
    background:linear-gradient(180deg, #FFFFFF, #FFFDF8);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px 15px;
    display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;
    box-shadow:0 2px 10px rgba(27,44,72,.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .summary-card::before{content:"";position:absolute;top:0;left:14px;right:14px;height:4px;border-radius:0 0 var(--r-pill) var(--r-pill);background:linear-gradient(90deg, var(--brass-300), var(--brass-500));}
  .summary-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(27,44,72,.12);}
  .summary-card.grand{background:linear-gradient(160deg, var(--navy-900), var(--navy-950));border-color:var(--navy-line);}
  .summary-card.grand::before{background:linear-gradient(90deg, var(--brass-300), var(--steel-300));}
  .summary-card.grand .label{color:var(--brass-300);}
  .summary-card.grand .value{color:#fff;}
  .summary-card .label{font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .summary-card .value{font-size:19px;font-weight:700;color:var(--navy-900);font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* ---------- Assumptions bar ---------- */
  .assump-bar{
    display:flex;gap:24px;padding:16px 22px;border-radius:var(--r-md);margin-bottom:20px;flex-wrap:wrap;align-items:center;
    background:linear-gradient(135deg, var(--navy-900), var(--navy-950));
    box-shadow:0 8px 20px rgba(11,18,32,.16);
    border:1px solid var(--navy-line);
  }
  .assump-field label{display:block;font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--brass-300);margin-bottom:5px;font-weight:600;}
  .assump-field input{width:90px;background:rgba(255,255,255,.07);border:1px solid var(--navy-line);color:#fff;padding:8px 12px;border-radius:var(--r-sm);font-size:13px;font-family:var(--mono);}
  .assump-field input:focus{outline:2px solid var(--brass-300);outline-offset:1px;}
  .assump-note{color:#9AABBB;font-size:12px;margin-left:auto;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap;
    background:var(--panel);padding:7px;border-radius:var(--r-md);border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(27,44,72,.05);
  }
  .tab-btn{
    border:none;background:transparent;padding:9px 16px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;letter-spacing:.4px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
    font-family:var(--display);text-transform:uppercase;
  }
  .tab-btn:hover{background:var(--line-soft);color:var(--navy-900);}
  .tab-btn.active{
    background:linear-gradient(135deg, var(--navy-800), var(--navy-950));
    color:#fff;box-shadow:0 4px 12px rgba(16,27,48,.25);
  }
  .tab-btn.main{font-size:13px;padding:11px 22px;}
  .tabs.subtabs{background:transparent;border:none;box-shadow:none;padding:0 0 4px;margin-bottom:14px;gap:8px;}
  .tab-btn.sub{background:var(--panel);border:1px solid var(--line);color:var(--navy-900);font-size:11.5px;padding:7px 15px;}
  .tab-btn.sub:hover{background:var(--line-soft);}
  .tab-btn.sub.active{background:linear-gradient(135deg, var(--brass-300), var(--brass-500));color:var(--navy-950);border-color:var(--brass-500);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .tab-panel.active{animation:none;}
  }

  .panel-toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .hint{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .print-heading{display:none;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:auto;box-shadow:0 4px 16px rgba(27,44,72,.06);max-height:70vh;}
  table{border-collapse:collapse;width:100%;min-width:760px;}
  thead th{background:linear-gradient(135deg, var(--navy-800), var(--navy-950));color:#fff;font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:500;padding:11px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2;}
  thead th.left{text-align:left;padding-left:12px;}
  tbody td{padding:7px 6px;border-bottom:1px solid var(--line-soft);text-align:center;font-size:13px;}
  tbody tr:nth-child(even){background:#FBF8F1;}
  tbody tr:hover{background:#F4EFE3;}
  tbody tr.section-row td{
    background:linear-gradient(90deg, var(--brass-500), var(--brass-300));
    color:var(--navy-950);font-family:var(--display);font-weight:600;text-align:left;padding-left:12px;
    text-transform:uppercase;font-size:11px;letter-spacing:.8px;border-bottom:1px solid var(--brass-600);
  }
  td.left{text-align:left;padding-left:10px;font-weight:700;color:var(--navy-900);white-space:nowrap;}
  input[type=number]{width:100%;min-width:66px;border:1px solid var(--brass-500);border-radius:var(--r-sm);padding:6px 8px;font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--ink);background:#FFFDF8;transition:box-shadow .12s ease, border-color .12s ease;}
  input[type=number]:focus{outline:none;border-color:var(--brass-300);box-shadow:0 0 0 3px rgba(214,154,78,.28);}
  .computed{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;}
  .computed.strong{font-weight:700;color:var(--navy-900);}
  tfoot td{background:var(--line-soft);font-weight:700;color:var(--navy-900);padding:10px 6px;text-align:center;font-family:var(--mono);border-top:2px solid var(--brass-500);}
  tfoot td.left{text-align:right;padding-right:14px;font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-size:11.5px;}

  footer.tool-footer{margin-top:26px;font-size:11px;color:var(--ink-soft);text-align:center;font-family:var(--display);letter-spacing:.6px;text-transform:uppercase;}

  /* ---------- Diameter Summary: section titles + combined grand total ---------- */
  .dia-section-title{
    font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    color:var(--navy-950);background:linear-gradient(90deg, var(--brass-300), var(--brass-500));
    padding:9px 14px;border-radius:var(--r-sm) var(--r-sm) 0 0;margin:18px 0 0;
  }
  .dia-section-title + .table-wrap{border-top-left-radius:0;border-top-right-radius:0;}
  .dia-grand-total{
    display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;
    background:linear-gradient(160deg, var(--navy-900), var(--navy-950));border:1px solid var(--navy-line);
    border-radius:var(--r-md);padding:14px 18px;
  }
  .dia-grand-label{font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:#EADFC8;}
  .dia-grand-value{font-family:var(--mono);font-size:20px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}

  @media (max-width:720px){
    .summary-bar{grid-template-columns:1fr 1fr;}
    .topbar-main{flex-direction:column;align-items:flex-start;gap:14px;}
    .flow-rail{display:none;}
  }

/* ================= PRINT ================= */
@page{ size:landscape; margin:12mm; }
@media print{
  html,body{background:#fff;}
  .app{max-width:100%;padding:0;}

  .actions, .tabs, .panel-toolbar, .assump-note, .corner-tick, .flow-rail{display:none !important;}

  .tab-panel{display:block !important;break-inside:avoid-page;margin:0 0 12px;animation:none !important;}
  .print-heading{display:block !important;font-family:var(--display);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--navy-900);margin:0 0 4px;padding-bottom:3px;border-bottom:2px solid var(--brass-500);}

  .topbar{
    background:var(--navy-950) !important;animation:none !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    box-shadow:none;border-radius:0;border:none;margin-bottom:10px;
  }
  .topbar::before{display:none;}
  .topbar-main{padding:14px 4px;}
  .assump-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:0;}
  .summary-card{box-shadow:none;break-inside:avoid;}
  .summary-card.grand{-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  .table-wrap{max-height:none !important;overflow:visible !important;border:1px solid #999;box-shadow:none;border-radius:0;}
  table{width:100%;min-width:0;}
  thead th, tbody td{padding:4px 5px;font-size:10.5px;}

  thead{display:table-header-group;}
  tr{page-break-inside:avoid;break-inside:avoid;}
  thead th, tbody tr.section-row td, tfoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  input[type=number]{
    border:none !important;background:transparent !important;box-shadow:none !important;
    -webkit-appearance:none;appearance:none;padding:0;font-weight:700;color:var(--ink);
  }

  footer.tool-footer{display:none;}

  #panel_PriceList, #panel_VPriceList{display:none !important;}

  tr.print-hide-row{display:none !important;}
  .tab-panel.print-hide-panel{display:none !important;}

  /* keep only Item/Size/Unit/Qty + Unit Rate + Total Price; hide the intermediate cost columns */
  table.cat-table thead th:nth-child(5), table.cat-table tbody td:nth-child(5),
  table.cat-table thead th:nth-child(6), table.cat-table tbody td:nth-child(6),
  table.cat-table thead th:nth-child(7), table.cat-table tbody td:nth-child(7),
  table.cat-table thead th:nth-child(8), table.cat-table tbody td:nth-child(8),
  table.cat-table thead th:nth-child(9), table.cat-table tbody td:nth-child(9){
    display:none !important;
  }

  .dia-section-title{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid;break-inside:avoid;}
  .dia-grand-total{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;}
  #tbl_DiaSummaryA, #tbl_DiaSummaryB{min-width:0;}
  #tbl_DiaSummaryA thead th, #tbl_DiaSummaryA tbody td,
  #tbl_DiaSummaryB thead th, #tbl_DiaSummaryB tbody td{font-size:9.5px;padding:4px 4px;}
}
  
</style>
<style id="ces-theme">
/* =====================================================================
   CES POOL SUITE THEME - same palette, backgrounds, header and motion
   as Piping-Calculator (screen only; print keeps the clean white report)
   ===================================================================== */
@keyframes cesFlow{0%,100%{background-position:0 0,0% 0}50%{background-position:0 0,100% 0}}
@keyframes cesBob{0%,100%{transform:translateX(-1.4px)}50%{transform:translateX(1.4px)}}
@keyframes cesDr1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,50px)}}
@keyframes cesDr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,40px)}}
@keyframes cesSl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes cesRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- hero header (layout shared; colours in screen block) ---------- */
header.hero{
  position:relative;overflow:hidden;color:#EAF7F7;
  padding:28px 26px 24px;margin-bottom:24px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;}
header.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 34px);}
.hero-text,.hero .actions{position:relative;z-index:1;}
.hero-text h1{font-size:clamp(21px,3.6vw,30px);margin:0 0 8px;font-weight:800;letter-spacing:-.4px;color:#fff;}
.hero-text p{margin:0;color:#BFDEDF;font-size:14.5px;max-width:68ch;}
.hero-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;user-select:none;}
.ces-logo{width:38px;height:38px;flex:0 0 38px;}
.ces-logo svg{width:100%;height:100%;display:block;overflow:visible;}
.hero-brand b{display:block;font-size:15px;letter-spacing:.2px;line-height:1.1;color:#fff;}
.hero-brand small{display:block;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin-top:2px;}
header.hero .actions{justify-content:flex-end;max-width:620px;}

.ces-bg{display:none;}

@media screen{
  :root{
    color-scheme:dark;
    --abyss:#052630; --deep:#073A47; --teal:#0E6B78; --lagoon:#1A9AA0; --aqua:#4DE0CF;
    --foam:#D5F6F0; --mute:#8DB8BC; --sand:#EBCB92;
    --paper:#052630; --panel:rgba(255,255,255,.055);
    --ink:#E6F6F5; --ink-soft:#8DB8BC;
    --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.07);
    --brass-300:#5BEBDA; --brass-500:#22AEB0; --brass-600:#1A9AA0;
    --amber-500:#22AEB0; --amber-600:#1A9AA0; --steel-300:#8FE3DE; --steel-500:#22AEB0; --teal-500:#22AEB0;
    --sans:Inter,'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  html{background:#052630;}
  html,body{color:var(--ink);}
  body{
    background:linear-gradient(180deg,#073341 0%,#052630 55%,#041C25 100%);
    background-attachment:fixed;background-repeat:no-repeat;font-family:var(--sans);line-height:1.5;min-height:100vh;
  }
  ::selection{background:rgba(77,224,207,.35);color:#fff;}
  *{scrollbar-color:rgba(77,224,207,.38) rgba(255,255,255,.04);}
  .app{position:relative;z-index:1;max-width:1560px;padding:22px 18px 70px;}

  /* animated background: drifting orbs + sliding waves */
  .ces-bg{display:block;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .ces-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;}
  .ces-o1{width:480px;height:480px;left:-120px;top:40px;background:#17B3A8;animation:cesDr1 26s ease-in-out infinite;}
  .ces-o2{width:520px;height:520px;right:-160px;top:200px;background:#2A78C8;opacity:.38;animation:cesDr2 32s ease-in-out infinite;}
  .ces-o3{width:380px;height:380px;left:35%;bottom:-140px;background:#0F8E86;opacity:.4;animation:cesDr1 38s ease-in-out infinite reverse;}
  .ces-waves{position:absolute;left:0;right:0;bottom:0;height:120px;opacity:.55;}
  .ces-waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%;}
  .ces-waves .a{animation:cesSl 22s linear infinite;}
  .ces-waves .b{animation:cesSl 34s linear infinite reverse;opacity:.6;}

  /* header (flowing gradient like the suite top bar) */
  header.hero{
    background:radial-gradient(500px 90px at 85% -20%,rgba(77,224,207,.28),transparent 70%),
               linear-gradient(115deg,#052F3B 0%,#0A5260 45%,#127A85 75%,#0A5260 100%);
    background-size:100% 100%,250% 100%;
    animation:cesFlow 30s ease-in-out infinite;
    border:1px solid rgba(255,255,255,.1);border-radius:20px;
    box-shadow:0 22px 50px -26px rgba(0,0,0,.75);
  }
  header.hero::before{background:radial-gradient(420px 220px at 92% -15%,rgba(77,224,207,.12),transparent 70%);}
  .ces-logo{filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));}

  /* buttons */
  .btn{

  /* assumptions bar = glass card */
  .assump-bar{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.11);border-radius:18px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 26px -16px rgba(0,0,0,.65);
  }
  .assump-bar::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;pointer-events:none;background:linear-gradient(90deg,#2FC4B2,transparent 80%);}
  .assump-field label{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:none;color:var(--mute);}
  .assump-field input,input[type=number]{
    color:var(--ink);background:rgba(3,25,32,.55);border:1px solid rgba(255,255,255,.14);border-radius:10px;
  }
  .assump-field input:focus,input[type=number]:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 3px rgba(77,224,207,.18);}
  input[type=number]{font-family:var(--mono);background:rgba(3,25,32,.55);}
  input[readonly]{background:rgba(255,255,255,.06) !important;color:var(--mute);border-style:dashed;}
  input::placeholder{color:#6F9AA0;}
  .assump-note{color:var(--mute);}

  /* summary cards */
  .summary-card{
    background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.11);border-radius:18px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 26px -16px rgba(0,0,0,.65);
    transition:transform .25s,border-color .25s,box-shadow .25s;
  }
  .summary-card::before{left:0;right:0;height:2px;border-radius:0;background:linear-gradient(90deg,#2FC4B2,transparent 80%);}
  .summary-card:hover{transform:translateY(-3px);border-color:rgba(77,224,207,.5);box-shadow:0 22px 44px -18px rgba(0,0,0,.65),0 0 0 1px rgba(77,224,207,.22);}
  .summary-card .label{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:none;color:var(--mute);}
  .summary-card .value{color:var(--ink);font-weight:600;}
  .summary-card.grand{background:linear-gradient(135deg,#0F6F7B,#0A4A57);border-color:rgba(77,224,207,.4);}
  .summary-card.grand::before{background:linear-gradient(90deg,#5BEBDA,transparent 85%);}
  .summary-card.grand .label{color:#B9EDE8;}
  .summary-card.grand .value{color:#fff;}

  /* tabs = glass pill with gradient active state */
  .tabs{
    width:fit-content;max-width:100%;gap:2px;padding:4px;margin-bottom:16px;
    border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(3,25,32,.38);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:none;
  }
  .tab-btn{
    font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:12px;color:#A9CDD0;
    transition:background .2s,color .2s,box-shadow .2s;
  }
  .tab-btn:hover{color:#fff;background:rgba(255,255,255,.07);}
  .tab-btn.active{background:linear-gradient(135deg,#5BEBDA,#22AEB0);color:#032B33;box-shadow:0 6px 16px -6px rgba(77,224,207,.7);}
  .tab-btn.main{font-size:13px;padding:9px 18px;}
  .tabs.subtabs{background:transparent;border:none;box-shadow:none;padding:0 0 4px;margin-bottom:14px;gap:8px;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .tab-btn.sub{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#A9CDD0;font-size:12.5px;padding:7px 15px;border-radius:12px;}
  .tab-btn.sub:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(77,224,207,.45);}
  .tab-btn.sub.active{background:linear-gradient(135deg,#5BEBDA,#22AEB0);color:#032B33;border-color:rgba(77,224,207,.6);}
  .tab-panel.active{animation:cesRise .35s ease both;}
  .hint{color:var(--mute);}

  /* tables */
  .table-wrap{
    background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.11);border-radius:18px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 26px -16px rgba(0,0,0,.65);
  }
  thead th{
    background:#0A4A57;color:#fff;font-family:var(--sans);font-size:11.5px;font-weight:700;
    letter-spacing:.2px;text-transform:none;border-bottom:1px solid rgba(255,255,255,.1);
  }
  tbody td{border-bottom:1px solid rgba(255,255,255,.07);}
  tbody tr:nth-child(even){background:rgba(255,255,255,.03);}
  tbody tr:hover{background:rgba(77,224,207,.08);}
  tbody tr.section-row td{
    background:linear-gradient(90deg,rgba(77,224,207,.30),rgba(77,224,207,.07));
    color:var(--foam);font-family:var(--sans);font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    border-bottom:1px solid rgba(77,224,207,.4);
  }
  tbody tr.section-row:hover td{background:linear-gradient(90deg,rgba(77,224,207,.34),rgba(77,224,207,.09));}
  td.left{color:#fff;}
  .computed{color:var(--ink);}
  .computed.strong{color:#fff;}
  tfoot td{background:rgba(77,224,207,.10);color:#fff;border-top:2px solid rgba(77,224,207,.6);}
  tfoot td.left{font-family:var(--sans);letter-spacing:.3px;}

  /* diameter summary */
  .dia-section-title{
    font-family:var(--sans);font-size:12.5px;letter-spacing:.3px;color:var(--foam);
    background:linear-gradient(90deg,rgba(77,224,207,.30),rgba(77,224,207,.07));
    border:1px solid rgba(77,224,207,.35);border-bottom:none;border-radius:14px 14px 0 0;
  }
  .dia-section-title + .table-wrap{border-radius:0 0 18px 18px;}
  .dia-grand-total{
    background:linear-gradient(135deg,#0F6F7B,#0A4A57);border:1px solid rgba(77,224,207,.4);border-radius:18px;
    box-shadow:0 10px 26px -16px rgba(0,0,0,.65);
  }
  .dia-grand-label{font-family:var(--sans);color:#B9EDE8;letter-spacing:.4px;}
  .dia-grand-value{color:#fff;}

  footer.tool-footer{
    margin-top:34px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;
    font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:none;color:var(--mute);text-align:left;
  }

  /* saved-calculations modal (extra specificity: the modal block comes later) */
  .modal-overlay{background:rgba(2,16,21,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .modal-overlay .modal-box{
    background:linear-gradient(160deg,#0B4350,#073A47);border:1px solid rgba(77,224,207,.28);border-radius:18px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.8);color:var(--ink);
  }
  .modal-overlay .modal-box h3{font-family:var(--sans);color:#fff;}
  .modal-overlay .modal-box .proj-empty,.modal-overlay .modal-box .proj-date{color:var(--mute);}
  .modal-overlay .modal-box .proj-item{border-bottom-color:rgba(255,255,255,.1);}
  .modal-overlay .modal-box .proj-name{color:#fff;}
  .modal-overlay .modal-box .btn-load{background:linear-gradient(135deg,#5BEBDA,#22AEB0);color:#032B33;font-weight:700;border-radius:8px;}
  .modal-overlay .modal-box .btn-del{background:rgba(255,143,128,.18);color:#FF8F80;border:1px solid rgba(255,143,128,.4);border-radius:8px;}
  .modal-overlay .modal-box .modal-close{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;}
  .modal-overlay .modal-box .modal-close:hover{background:rgba(77,224,207,.16);}

  @media (max-width:720px){
    header.hero{border-radius:16px;padding:22px 18px 20px;}
    header.hero .actions{justify-content:flex-start;max-width:none;}
    .tabs{width:100%;}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
}

/* ---------- print: keep the clean report, neutralise the new header ---------- */
@media print{
  .ces-bg{display:none !important;}
  header.hero{
    background:var(--navy-950) !important;color:#fff;animation:none !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    box-shadow:none;border-radius:0;border:none;margin-bottom:10px;padding:14px 4px;
  }
  header.hero::before,header.hero::after{display:none;}
  .hero-brand,.ces-logo{display:none !important;}
  .hero-text h1{background:none !important;-webkit-text-fill-color:#fff;color:#fff !important;margin:0;font-size:20px;}
  .hero-text p{color:rgba(255,255,255,.8);font-size:11px;}
}
</style>

    if(saved && saved.assump){
      assump.vat = Number(saved.assump.vat)||assump.vat;
      assump.inst = Number(saved.assump.inst)||assump.inst;
      assump.prof = Number(saved.assump.prof)||assump.prof;
    }
  }catch(e){ /* corrupt/unavailable storage - fall back to defaults */ }
}

/* ---------- full working-state save / load (quantities + prices + assumptions) ---------- */
const AUTOSAVE_KEY = 'pipingCostApp_autosave_v1';
const PROJECTS_KEY = 'pipingCostApp_savedProjects_v1';

function captureFullState(){
  const qty = {}, qtyPerJoint = {}, dry = {};
  Object.keys(rowByKey).forEach(k=>{
    const r = rowByKey[k];
    dry[k] = r.dry;
    if(r.hasOwnProperty('qty')) qty[k] = r.qty;
    if(r.hasOwnProperty('qty_per_joint')) qtyPerJoint[k] = r.qty_per_joint;
  });
  return {
    qty: qty, qtyPerJoint: qtyPerJoint, dry: dry,
    assump: {vat:assump.vat, inst:assump.inst, prof:assump.prof},
    savedAt: new Date().toISOString()
  };
}

function applyFullState(state){
  if(!state) return;
  Object.keys(rowByKey).forEach(k=>{
    const r = rowByKey[k];
    if(state.dry && state.dry.hasOwnProperty(k)) r.dry = Number(state.dry[k])||0;
    if(state.qty && state.qty.hasOwnProperty(k)) r.qty = Number(state.qty[k])||0;
    if(state.qtyPerJoint && state.qtyPerJoint.hasOwnProperty(k)) r.qty_per_joint = Number(state.qtyPerJoint[k])||0;
  });
  if(state.assump){
    assump.vat = Number(state.assump.vat)||assump.vat;
    assump.inst = Number(state.assump.inst)||assump.inst;
    assump.prof = Number(state.assump.prof)||assump.prof;
  }
  Object.keys(rowByKey).forEach(k=>{
    const r = rowByKey[k];
    const qInput = document.getElementById('q_'+k);
    if(qInput && !qInput.hasAttribute('readonly')) qInput.value = r.qty;
    const dInput = document.getElementById('d_'+k);
    if(dInput) dInput.value = r.dry;
    const qpjInput = document.getElementById('qpj_'+k);
    if(qpjInput) qpjInput.value = r.qty_per_joint;
  });
  const vatInput = document.getElementById('vatInput');
  const instInput = document.getElementById('instInput');
  const profInput = document.getElementById('profInput');
  if(vatInput) vatInput.value = round2(assump.vat*100);
  if(instInput) instInput.value = round2(assump.inst*100);
  if(profInput) profInput.value = round2(assump.prof*100);
  saveDryPrices();
  recalcAll();
}

function backupFileName(){
  const t = new Date();
  const p2 = n => String(n).padStart(2,'0');
  return 'CES_Piping_Cost_Backup_'+t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())+'_'+p2(t.getHours())+p2(t.getMinutes())+'.json';
}

function downloadBackup(){
  const payload = {app:'CES-Piping-Cost', version:1, exportedAt:new Date().toISOString(), state:captureFullState(), projects:loadProjects()};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = backupFileName();
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function restoreBackupFromText(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ alert('This file is not a valid backup.'); return; }
  const state = data && data.state ? data.state : (data && data.dry ? data : null);
  if(!state || !state.dry){ alert('This file is not a valid backup.'); return; }
  const projCount = data.projects ? Object.keys(data.projects).length : 0;
  if(!confirm('Restore this backup? Current quantities and prices will be replaced'+(projCount ? ' and '+projCount+' saved calculation(s) will be added.' : '.'))) return;
  if(data.projects){
    try{
      const merged = Object.assign({}, loadProjects(), data.projects);
      localStorage.setItem(PROJECTS_KEY, JSON.stringify(merged));
    }catch(e){}
  }
  applyFullState(state);
  alert('Backup restored.');
}

function hasAnyQty(state){
  if(!state || !state.qty) return false;
  return Object.keys(state.qty).some(k=> Number(state.qty[k])>0);
}

let autosaveTimer = null;
function scheduleAutosave(){
  if(autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function(){
    try{
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(captureFullState()));
    }catch(e){ /* storage unavailable - ignore */ }
  }, 800);
}

function offerAutosaveRestore(){
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return;
    const state = JSON.parse(raw);
    if(!hasAnyQty(state)) return;
    const when = state.savedAt ? new Date(state.savedAt).toLocaleString() : '';
    if(confirm('We found unsaved work from last time (from '+when+'). Continue where you left off?')){
      applyFullState(state);
    }
  }catch(e){ /* corrupt autosave - ignore */ }
}

function loadProjects(){
  try{
    const raw = localStorage.getItem(PROJECTS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function saveProjectAs(name){
  try{
    const projects = loadProjects();
    const id = 'p_'+Date.now();
    projects[id] = Object.assign({name:name}, captureFullState());
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
    return true;
  }catch(e){ return false; }
}

function deleteProject(id){
  try{
    const projects = loadProjects();
    delete projects[id];
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
  }catch(e){ /* ignore */ }
}

function renderSavedProjectsList(){
  const wrap = document.getElementById('savedProjectsList');
  if(!wrap) return;
  const projects = loadProjects();
  const ids = Object.keys(projects).sort(function(a,b){ return (projects[b].savedAt||'').localeCompare(projects[a].savedAt||''); });
  if(ids.length===0){
    wrap.innerHTML = '<div class="proj-empty">No saved calculations yet. Use the "Save Progress" button to save the current calculation under a name.</div>';
    return;
  }
  wrap.innerHTML = '';
  ids.forEach(function(id){
    const p = projects[id];
    const when = p.savedAt ? new Date(p.savedAt).toLocaleString() : '';
    const item = el('div',{class:'proj-item'});
    const info = el('div',{});
    info.appendChild(el('div',{class:'proj-name'}, p.name||'Untitled'));
    info.appendChild(el('div',{class:'proj-date'}, when));
    item.appendChild(info);
    const actions = el('div',{class:'proj-actions'});
    const loadBtn = el('button',{class:'btn-load'}, 'Load');
    loadBtn.addEventListener('click', function(){
      applyFullState(p);
      document.getElementById('savedModalOverlay').classList.remove('open');
    });
    const delBtn = el('button',{class:'btn-del'}, 'Delete');
    delBtn.addEventListener('click', function(){
      if(confirm('Are you sure you want to delete the saved calculation "'+(p.name||'')+'"?')){
        deleteProject(id);
        renderSavedProjectsList();
      }
    });
    actions.appendChild(loadBtn);
    actions.appendChild(delBtn);
    item.appendChild(actions);
    wrap.appendChild(item);
  });
}

function resetAllQuantities(){
  if(!confirm('This will clear all entered quantities (prices and rates stay the same). Continue?')) return;
  Object.keys(rowByKey).forEach(function(k){
    const r = rowByKey[k];
    if(r.hasOwnProperty('qty')) r.qty = 0;

/* unified helpers so table-builders / recalc work for either group transparently */
function getCatRows(cat){ return CATS.includes(cat) ? DATA.cats[cat] : VALVE_DATA.cats[cat]; }
function getCatLabel(cat){ return PIPE_CAT_LABELS[cat] || VALVE_CAT_LABELS[cat] || cat; }
const rowTotalMap = {}; // key = cat+'_'+orig_row -> computed total price (filled every recalc, used by Diameter Summary)

function qtyOf(cat, row){ return Number(rowByKey[cat+'_'+row].qty)||0; }

function jointCount(w){
  return w.contrib.reduce((sum,c)=> sum + c.coeff*qtyOf(c.cat, c.row), 0);
}

function pricing(dry, qty){
  const vatAmt = dry*assump.vat;
  const instAmt = dry*assump.inst;
  const concept = dry+vatAmt+instAmt;
  const profAmt = concept*assump.prof;
  const unitRate = concept+profAmt;
  const total = unitRate*qty;
  return {vatAmt, instAmt, concept, profAmt, unitRate, total};
}

    panel.appendChild(toolbar(hintText));
    panel.appendChild(buildCatTable(leaf.id));
  } else if(VALVE_CATS.includes(leaf.id)){
    const hintText = leaf.id==='BallValve' ? 'Qty = No of Units' : 'Qty = No of Units';
    panel.appendChild(toolbar(hintText));
    panel.appendChild(buildCatTable(leaf.id));
  } else if(leaf.id==='Summary'){
    panel.appendChild(buildSummaryTable('Pipe'));
  } else if(leaf.id==='VSummary'){
    panel.appendChild(buildSummaryTable('Valve'));
  } else if(leaf.id==='DiaSummary'){
    panel.appendChild(toolbar('Diameters below 250 mm: one combined Pipe+Fittings total (no valves). Diameters 250 mm and above: split by category (Elbow 90 / Elbow 45 / Tee / Welding / Solvent / Other), including valves.'));
    panel.appendChild(buildDiameterSummaryTable());
  }
  return panel;
}

function showLeafPanel(leafId){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('panel_'+leafId);
  if(panel) panel.classList.add('active');
}

function renderSubNav(mainId){
  const subNav = document.getElementById('subTabsNav');
  subNav.innerHTML = '';
  const leaves = LEAF_DEFS[mainId];
  if(leaves.length<=1){ subNav.style.display='none'; showLeafPanel(leaves[0].id); return; }
  subNav.style.display='flex';
  leaves.forEach((leaf,i)=>{
    const btn = el('button',{class:'tab-btn sub'+(i===0?' active':''), 'data-tab':leaf.id}, '<span>'+leaf.label+'</span>');
    btn.addEventListener('click', function(){
      subNav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      showLeafPanel(this.dataset.tab);
    });
    subNav.appendChild(btn);
  });

function initTabsAndPanels(){
  const nav = document.getElementById('tabsNav');

  MAIN_TABS.forEach((m,i)=>{
    const btn = el('button',{class:'tab-btn main'+(i===0?' active':''), 'data-tab':m.id}, '<span>'+m.label+'</span>');
    btn.addEventListener('click', function(){
      nav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

      renderSubNav(this.dataset.tab);
    });
    nav.appendChild(btn);
    LEAF_DEFS[m.id].forEach(leaf=> panels.appendChild(buildLeafPanel(m.id, leaf)));
  });
  renderSubNav(MAIN_TABS[0].id);
}

/* ---------- recalc ---------- */
function setText(id, text){ const e = document.getElementById(id); if(e) e.textContent = text; }

function recalcGroup(cfg, totals){
  cfg.cats.forEach(cat=>{
    let catTotal = 0;
    cfg.data.cats[cat].forEach(r=>{
      const dry = Number(r.dry)||0;
      const qty = Number(r.qty)||0;
      const p = pricing(dry, qty);
      if(cfg.solventFlatFee){
        let boltsFee = 0;
        const sizeNum = parseFloat(normSize(r.size));
        if(!isNaN(sizeNum) && sizeNum>=cfg.solventFlatMinSize){
          boltsFee = cfg.solventFlatFee*qty;
          p.unitRate += cfg.solventFlatFee;
          p.total = p.unitRate*qty;
        }
        setText('c_bolts_'+cat+'_'+r.orig_row, fmt(boltsFee));
      }
      setText('c_dry_'+cat+'_'+r.orig_row, fmt(dry));
      setText('c_vat_'+cat+'_'+r.orig_row, fmt(p.vatAmt));
      setText('c_inst_'+cat+'_'+r.orig_row, fmt(p.instAmt));
      setText('c_concept_'+cat+'_'+r.orig_row, fmt(p.concept));
      setText('c_prof_'+cat+'_'+r.orig_row, fmt(p.profAmt));
      setText('c_rate_'+cat+'_'+r.orig_row, fmt(p.unitRate));
      setText('c_total_'+cat+'_'+r.orig_row, fmt(p.total));
      rowTotalMap[cat+'_'+r.orig_row] = p.total;
      catTotal += p.total;
    });
    setText('tot_'+cat, fmt(catTotal));
    totals[cat] = catTotal;
  });

  let weldTotal = 0;
  const weldJoints = {};
  cfg.data.weld.forEach(r=>{
    const joints = jointCount(r);
    weldJoints[r.orig_row] = joints;
    const qpj = Number(r.qty_per_joint)||0;
    const kgqty = (joints*qpj)/1000;
    const dry = Number(r.dry)||0;
    const p = pricing(dry, kgqty);
    setText('c_joints_'+cfg.weldKind+'_'+r.orig_row, fmtInt(joints));
    setText('c_kgqty_'+cfg.weldKind+'_'+r.orig_row, kgqty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3}));
    setText('c_dry_'+cfg.weldKind+'_'+r.orig_row, fmt(dry));
    setText('c_vat_'+cfg.weldKind+'_'+r.orig_row, fmt(p.vatAmt));
    setText('c_inst_'+cfg.weldKind+'_'+r.orig_row, fmt(p.instAmt));
    setText('c_concept_'+cfg.weldKind+'_'+r.orig_row, fmt(p.concept));
    setText('c_prof_'+cfg.weldKind+'_'+r.orig_row, fmt(p.profAmt));
    setText('c_rate_'+cfg.weldKind+'_'+r.orig_row, fmt(p.unitRate));
    setText('c_total_'+cfg.weldKind+'_'+r.orig_row, fmt(p.total));
    rowTotalMap[cfg.weldKind+'_'+r.orig_row] = p.total;
    weldTotal += p.total;
  });
  setText('tot_'+cfg.weldKind, fmt(weldTotal));
  totals[cfg.weldKind] = weldTotal;

  let solvTotal = 0;
  cfg.data.solv.forEach((r,idx)=>{
    const wr = cfg.data.weld[idx];
    const joints = weldJoints[wr.orig_row];
    const qpj = (Number(wr.qty_per_joint)||0)/2;
    const kgqty = (joints*qpj)/1000;
    const dry = Number(r.dry)||0;
    const p = pricing(dry, kgqty);
    setText('qpj_'+cfg.solvKind+'_'+r.orig_row, qpj.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
    setText('c_joints_'+cfg.solvKind+'_'+r.orig_row, fmtInt(joints));
    setText('c_kgqty_'+cfg.solvKind+'_'+r.orig_row, kgqty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3}));
    setText('c_dry_'+cfg.solvKind+'_'+r.orig_row, fmt(dry));
    setText('c_vat_'+cfg.solvKind+'_'+r.orig_row, fmt(p.vatAmt));
    setText('c_inst_'+cfg.solvKind+'_'+r.orig_row, fmt(p.instAmt));
    setText('c_concept_'+cfg.solvKind+'_'+r.orig_row, fmt(p.concept));
    setText('c_prof_'+cfg.solvKind+'_'+r.orig_row, fmt(p.profAmt));
    setText('c_rate_'+cfg.solvKind+'_'+r.orig_row, fmt(p.unitRate));
    setText('c_total_'+cfg.solvKind+'_'+r.orig_row, fmt(p.total));
    rowTotalMap[cfg.solvKind+'_'+r.orig_row] = p.total;
    solvTotal += p.total;
  });
  setText('tot_'+cfg.solvKind, fmt(solvTotal));
  totals[cfg.solvKind] = solvTotal;

  let grand = 0;
  [...cfg.cats, cfg.weldKind, cfg.solvKind].forEach(k=>{ grand += totals[k]||0; setText('sum_'+k, fmt(totals[k]||0)); });
  setText(cfg.grandId, fmt(grand));
  return grand;
}

function recalcDiameterSummary(){
  const diaLen = {}, diaPipeCost = {}, diaElbow90 = {}, diaElbow45 = {}, diaTee = {}, diaOtherPipeSide = {}, diaValves = {};
  const diaWeldP = {}, diaSolvP = {}, diaWeldV = {}, diaSolvV = {};
  DIAMS.forEach(d=>{
    diaLen[d]=0; diaPipeCost[d]=0; diaElbow90[d]=0; diaElbow45[d]=0; diaTee[d]=0; diaOtherPipeSide[d]=0; diaValves[d]=0;
    diaWeldP[d]=0; diaSolvP[d]=0; diaWeldV[d]=0; diaSolvV[d]=0;
  });

  function accumulate(target, cat, rows){
    rows.forEach(r=>{
      const d = normSize(r.size);
      if(target.hasOwnProperty(d)) target[d] += rowTotalMap[cat+'_'+r.orig_row]||0;
    });
  }
  accumulate(diaPipeCost, 'Pipe', DATA.cats['Pipe']);
  accumulate(diaElbow90, 'Elbow 90', DATA.cats['Elbow 90']);
  accumulate(diaElbow45, 'Elbow 45', DATA.cats['Elbow 45']);
  accumulate(diaTee, 'Tee', DATA.cats['Tee']);
  accumulate(diaOtherPipeSide, 'Reducer', DATA.cats['Reducer']);
  accumulate(diaOtherPipeSide, 'Bush', DATA.cats['Bush']);
  accumulate(diaWeldP, 'Weld', DATA.weld);
  accumulate(diaSolvP, 'Solv', DATA.solv);
  VALVE_CATS.forEach(cat=> accumulate(diaValves, cat, VALVE_DATA.cats[cat]));
  accumulate(diaWeldV, 'VWeld', VALVE_DATA.weld);
  accumulate(diaSolvV, 'VSolv', VALVE_DATA.solv);

  DATA.cats['Pipe'].forEach(r=>{
    const d = normSize(r.size);
    if(diaLen.hasOwnProperty(d)) diaLen[d] += Number(r.qty)||0;
  });

  let grandElbow90=0, grandElbow45=0, grandTee=0, grandWeld=0, grandSolv=0, grandOther=0;
  let subPipeA=0, subWeldA=0, subSolvA=0, subTotalA=0, subPipeB=0, subTotalB=0;
  DIAMS.forEach(d=>{
    const len = diaLen[d]||0;
    const pipeCost = diaPipeCost[d]||0;
    const isSplit = Number(d) >= DIA_SPLIT_MIN;
    setText('dia_len_'+d, fmt(len));
    setText('dia_pipecost_'+d, fmt(pipeCost));

    if(isSplit){
      const e90 = diaElbow90[d]||0, e45 = diaElbow45[d]||0, tee = diaTee[d]||0;
      const weld = (diaWeldP[d]||0) + (diaWeldV[d]||0);
      const solv = (diaSolvP[d]||0) + (diaSolvV[d]||0);
      const other = (diaOtherPipeSide[d]||0) + (diaValves[d]||0);
      const totalB = pipeCost + e90 + e45 + tee + weld + solv + other;
      setText('dia_elbow90_'+d, fmt(e90));
      setText('dia_elbow45_'+d, fmt(e45));
      setText('dia_tee_'+d, fmt(tee));
      setText('dia_weld_'+d, fmt(weld));
      setText('dia_solv_'+d, fmt(solv));
      setText('dia_other_'+d, fmt(other));
      setText('dia_totalB_'+d, fmt(totalB));
      grandElbow90 += e90; grandElbow45 += e45; grandTee += tee; grandWeld += weld; grandSolv += solv; grandOther += other;
      subPipeB += pipeCost; subTotalB += totalB;
    } else {
      const weld = diaWeldP[d]||0, solv = diaSolvP[d]||0;
      const combined = pipeCost + (diaElbow90[d]||0) + (diaElbow45[d]||0) + (diaTee[d]||0) + (diaOtherPipeSide[d]||0) + weld + solv;
      setText('dia_weld_'+d, fmt(weld));
      setText('dia_solv_'+d, fmt(solv));
      setText('dia_cost_'+d, fmt(combined));
      setText('dia_cpmPipe_'+d, len>0 ? fmt(pipeCost/len) : '—');
      setText('dia_cpmAll_'+d, len>0 ? fmt(combined/len) : '—');
      subPipeA += pipeCost; subWeldA += weld; subSolvA += solv; subTotalA += combined;
    }
  });
  setText('dia_subPipeA', fmt(subPipeA));
  setText('dia_subWeldA', fmt(subWeldA));
  setText('dia_subSolvA', fmt(subSolvA));
  setText('dia_subTotalA', fmt(subTotalA));
  setText('dia_subPipeB', fmt(subPipeB));
  setText('dia_grandElbow90', fmt(grandElbow90));
  setText('dia_grandElbow45', fmt(grandElbow45));
  setText('dia_grandTee', fmt(grandTee));
  setText('dia_grandWeld', fmt(grandWeld));
  setText('dia_grandSolv', fmt(grandSolv));
  setText('dia_grandOther', fmt(grandOther));
  setText('dia_subTotalB', fmt(subTotalB));
  setText('dia_grandCombined', fmt(subTotalA + subTotalB) + ' EGP');
}

const SOCKET_MIN_DIAM = 90;

function syncSocketFlangeQty(){
  const bySize = {};
  DIAMS.forEach(d=>{ bySize[d] = {butterfly:0, gear:0, check:0, flex:0}; });
  (VALVE_DATA.cats['ButterflyValve']||[]).forEach(r=>{ const d=normSize(r.size); if(bySize[d]) bySize[d].butterfly = Number(r.qty)||0; });
  (VALVE_DATA.cats['GearValve']||[]).forEach(r=>{ const d=normSize(r.size); if(bySize[d]) bySize[d].gear = Number(r.qty)||0; });
  (VALVE_DATA.cats['CheckValve']||[]).forEach(r=>{ const d=normSize(r.size); if(bySize[d]) bySize[d].check = Number(r.qty)||0; });
  (VALVE_DATA.cats['FlexibleConnection']||[]).forEach(r=>{ const d=normSize(r.size); if(bySize[d]) bySize[d].flex = Number(r.qty)||0; });

  const socketQtyBySize = {};
  (VALVE_DATA.cats['Socket']||[]).forEach(r=>{
    const d = normSize(r.size);
    const b = bySize[d] || {butterfly:0,gear:0,check:0,flex:0};
    const qty = (Number(d) >= SOCKET_MIN_DIAM) ? (2*(b.butterfly+b.gear+b.check) + 2*b.flex) : 0;
    r.qty = qty;
    socketQtyBySize[d] = qty;
    const inp = document.getElementById('q_Socket_'+r.orig_row);
    if(inp) inp.value = qty;
  });
  (VALVE_DATA.cats['Flanges']||[]).forEach(r=>{
    const d = normSize(r.size);
    const qty = socketQtyBySize.hasOwnProperty(d) ? socketQtyBySize[d] : 0;
    r.qty = qty;
    const inp = document.getElementById('q_Flanges_'+r.orig_row);
    if(inp) inp.value = qty;
  });
}

function recalcAll(){
  syncSocketFlangeQty();
  const totals = {};
  const pipeGrand = recalcGroup(GROUP_CFG.Pipe, totals);
  const valveGrand = recalcGroup(GROUP_CFG.Valve, totals);
  const grand = pipeGrand + valveGrand;

  recalcDiameterSummary();
  renderSummaryBar(totals, grand);
  scheduleAutosave();
}

function renderSummaryBar(totals, grand){
  const bar = document.getElementById('summaryBar');
  bar.innerHTML = '';
  const pipeFittings = CATS.reduce((s,c)=>s+(totals[c]||0),0);
  const valveFittings = VALVE_CATS.reduce((s,c)=>s+(totals[c]||0),0);
  const weldSolv = (totals['Weld']||0)+(totals['Solv']||0)+(totals['VWeld']||0)+(totals['VSolv']||0);
  const cards = [
    {label:'Pipe &amp; Fittings Subtotal', value: pipeFittings},
    {label:'Valves &amp; Accessories Subtotal', value: valveFittings},
    {label:'Welding &amp; Solvent Subtotal', value: weldSolv},
    {label:'Grand Total', value: grand, grand:true},
  ];
  cards.forEach(c=>{
    const card = el('div',{class:'summary-card'+(c.grand?' grand':'')});
    const txt = el('div');
    txt.appendChild(el('div',{class:'label'}, c.label));
    txt.appendChild(el('div',{class:'value'}, fmt(c.value)+' EGP'));
    card.appendChild(txt);
    bar.appendChild(card);
  });
}

const CLR = {
  navy:'FF0A1B33', navyLight:'FF1C3A63', amber:'FFDFA355', amberDark:'FFC4863A',

function styleTitleRow(ws, rowNum, span){
  ws.mergeCells(rowNum,1,rowNum,span);
  const cell = ws.getCell(rowNum,1);
  cell.font = {bold:true, size:14, color:{argb:CLR.white}};

  cell.alignment = {vertical:'middle', horizontal:'center'};
  ws.getRow(rowNum).height = 28;
}
function styleHeaderRow(ws, rowNum, span){

    const cell = ws.getCell(rowNum,c);

    cell.border = {bottom:{style:'thin', color:{argb:CLR.border}}};
  }

}
function styleSectionRow(ws, rowNum, span, text){

function styleDataRow(ws, rowNum, span, alt){

function styleTotalRow(ws, rowNum, span){

    const cell = ws.getCell(rowNum,c);
    cell.font = {bold:true, color:{argb:CLR.navy}};

function colLetter(n){
  let s='';
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}

function computeGroupTotals(cfg){
  const rowTotal = {}, catTotals = {};
  cfg.cats.forEach(cat=>{
    let t=0;
    cfg.data.cats[cat].forEach(row=>{
      const p = pricing(Number(row.dry)||0, Number(row.qty)||0);
      let total = p.total;
      if(cfg.solventFlatFee){
        const sizeNum = parseFloat(normSize(row.size));
        if(!isNaN(sizeNum) && sizeNum>=cfg.solventFlatMinSize){
          total += cfg.solventFlatFee*(Number(row.qty)||0);
        }
      }
      rowTotal[cat+'_'+row.orig_row] = total;
      t += total;
    });
    catTotals[cat]=t;
  });
  let weldTotal=0;
  const weldJoints = {};
  cfg.data.weld.forEach(row=>{
    const joints=jointCount(row);
    weldJoints[row.orig_row]=joints;
    const kgqty=(joints*(Number(row.qty_per_joint)||0))/1000;
    const total = pricing(Number(row.dry)||0, kgqty).total;
    rowTotal[cfg.weldKind+'_'+row.orig_row] = total;
    weldTotal += total;
  });
  let solvTotal=0;
  cfg.data.solv.forEach((row,idx)=>{
    const wr=cfg.data.weld[idx];
    const joints=weldJoints[wr.orig_row];
    const qpj=(Number(wr.qty_per_joint)||0)/2;
    const kgqty=(joints*qpj)/1000;
    const total = pricing(Number(row.dry)||0, kgqty).total;
    rowTotal[cfg.solvKind+'_'+row.orig_row] = total;
    solvTotal += total;
  });
  return {rowTotal, catTotals, weldTotal, solvTotal};
}

async function exportExcel(){
  if(typeof ExcelJS === 'undefined'){ alert('Export library did not load. Check your internet connection.'); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Pipe Cost Engine';
  wb.created = new Date();

  /* ---- Assumptions sheet — every pricing formula below reads from here ---- */
  const wsA = wb.addWorksheet('Assumptions', {properties:{tabColor:{argb:CLR.teal}}});
  wsA.columns = [{width:30},{width:16},{width:44}];

  wsA.getRow(2).values = ['Assumption','Value','Notes'];

    ['VAT %', assump.vat, 'Applied to Dry cost'],

  });
  wsA.views = [{state:'frozen', ySplit:2}];
  const AS = {vat:'Assumptions!$B$3', inst:'Assumptions!$B$4', prof:'Assumptions!$B$5', boltsFee:'Assumptions!$B$6', boltsMin:'Assumptions!$B$7'};

  /* ---- Price List sheets (Pipe + Valves) ---- */
  const plCols = [{header:'Item',width:18},{header:'Size',width:12},{header:'Unit',width:9},{header:'Dry Cost (EGP)',width:18}];
  function buildPriceListSheet(sheetName, title, cfg){
    const ws = wb.addWorksheet(sheetName, {properties:{tabColor:{argb:CLR.amber}}});
    ws.columns = plCols.map(c=>({width:c.width}));
    styleTitleRow(ws, 1, 4);
    ws.getCell(1,1).value = title;
    let r = 2;
    ws.getRow(r).values = plCols.map(c=>c.header);
    styleHeaderRow(ws, r, 4);
    r++;
    let alt=false;
    function plSection(t2){ styleSectionRow(ws, r, 4, t2); r++; alt=false; }
    function plRow(item, size, unit, dry){
      ws.getRow(r).values = [item, size, unit, dry];
      ws.getCell(r,4).numFmt = '#,##0.00';
      styleDataRow(ws, r, 4, alt);
      alt = !alt; r++;
    }
    cfg.cats.forEach(cat=>{ plSection(getCatLabel(cat)); cfg.data.cats[cat].forEach(row=> plRow(row.item||getCatLabel(cat), row.size, row.unit, row.dry)); });
    plSection('Welding (rod / fusion material)');
    cfg.data.weld.forEach(row=> plRow('Welding', row.size, 'kg', row.dry));
    plSection('Solvent Cement');
    cfg.data.solv.forEach(row=> plRow('Solvent', row.size, 'kg', row.dry));
    ws.views = [{state:'frozen', ySplit:2}];
  }
  buildPriceListSheet('Price List', 'MASTER PRICE LIST — Pipe & Fittings', GROUP_CFG.Pipe);
  buildPriceListSheet('Valve Price List', 'MASTER PRICE LIST — Valves & Accessories', GROUP_CFG.Valve);

  /* ---- Category sheets (Pipe + Valves) ---- */
  const catHeaders = ['Item','Size','Unit','Qty','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Total price'];
  const catWidths = [16,12,8,9,12,10,16,13,10,12,14];
  const catHeadersBolts = ['Item','Size','Unit','Qty','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Bolts','Total price'];
  const catWidthsBolts = [16,12,8,9,12,10,16,13,10,12,12,14];
  function buildCatSheet(cat, cfg){
    const hasBolts = !!cfg.solventFlatFee;
    const headers = hasBolts ? catHeadersBolts : catHeaders;
    const widths = hasBolts ? catWidthsBolts : catWidths;
    const lastCol = headers.length;
    const filledRows = cfg.data.cats[cat].map(row=>{
      const p = pricing(Number(row.dry)||0, Number(row.qty)||0);
      let boltsFee = 0;
      if(hasBolts){
        const sizeNum = parseFloat(normSize(row.size));
        if(!isNaN(sizeNum) && sizeNum>=cfg.solventFlatMinSize){
          boltsFee = cfg.solventFlatFee*(Number(row.qty)||0);
          p.unitRate += cfg.solventFlatFee;
          p.total = p.unitRate*(Number(row.qty)||0);
        }
      }
      return {row, p, boltsFee};
    }).filter(x=> Math.abs(x.p.total) >= 0.005);
    if(!filledRows.length) return;
    const ws = wb.addWorksheet(getCatLabel(cat).slice(0,31), {properties:{tabColor:{argb:CLR.navyLight}}});
    ws.columns = widths.map(w=>({width:w}));
    styleTitleRow(ws, 1, lastCol);
    ws.getCell(1,1).value = getCatLabel(cat).toUpperCase() + ' — Quantities & Pricing';
    ws.getRow(2).values = headers;
    styleHeaderRow(ws, 2, lastCol);
    let rr = 3, a=false, total=0;
    filledRows.forEach(({row,p,boltsFee})=>{
      ws.getRow(rr).values = [row.item||'', row.size, row.unit, row.qty, row.dry];
      ws.getCell(rr,6).value = {formula:`E${rr}*${AS.vat}`};
      ws.getCell(rr,7).value = {formula:`E${rr}*${AS.inst}`};
      ws.getCell(rr,8).value = {formula:`E${rr}+F${rr}+G${rr}`};
      ws.getCell(rr,9).value = {formula:`H${rr}*${AS.prof}`};
      if(hasBolts){
        const boltsCond = `VALUE(TRIM(SUBSTITUTE(B${rr},"mm","")))>=${AS.boltsMin}`;
        ws.getCell(rr,10).value = {formula:`H${rr}+I${rr}+IF(${boltsCond},${AS.boltsFee},0)`};
        ws.getCell(rr,11).value = {formula:`IF(${boltsCond},${AS.boltsFee}*D${rr},0)`};
        ws.getCell(rr,12).value = {formula:`J${rr}*D${rr}`};
      } else {
        ws.getCell(rr,10).value = {formula:`H${rr}+I${rr}`};
        ws.getCell(rr,11).value = {formula:`J${rr}*D${rr}`};
      }
      const numFmtCols = hasBolts ? [5,6,7,8,9,10,11,12] : [5,6,7,8,9,10,11];
      for(const c of numFmtCols) ws.getCell(rr,c).numFmt = '#,##0.00';
      styleDataRow(ws, rr, lastCol, a);
      a = !a; total += p.total; rr++;
    });
    ws.getCell(rr,lastCol-1).value = 'TOTAL';
    ws.getCell(rr,lastCol).value = {formula:`SUM(${colLetter(lastCol)}3:${colLetter(lastCol)}${rr-1})`};
    ws.getCell(rr,lastCol).numFmt = '#,##0.00';
    styleTotalRow(ws, rr, lastCol);
    ws.views = [{state:'frozen', ySplit:2}];
  }
  CATS.forEach(cat=> buildCatSheet(cat, GROUP_CFG.Pipe));
  VALVE_CATS.forEach(cat=> buildCatSheet(cat, GROUP_CFG.Valve));

  /* ---- Welding / Solvent sheets (Pipe + Valves) ---- */
  const wsHeaders = ['Size','Qty per Joint (g)','Qty (kg)','N.o Joints','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Total price'];
  const wsWidths = [10,15,10,10,10,9,16,13,9,12,14];

  function buildWSSheet(name, rows, weldRowsForPairing, isWeld){
    const computed = rows.map((row, idx)=>{
      let joints, qpj;
      if(isWeld){ joints = jointCount(row); qpj = Number(row.qty_per_joint)||0; }
      else { const wr = weldRowsForPairing[idx]; joints = jointCount(wr); qpj = (Number(wr.qty_per_joint)||0)/2; }
      const kgqty = (joints*qpj)/1000;
      const p = pricing(Number(row.dry)||0, kgqty);
      return {row, joints, qpj, kgqty, p};
    }).filter(x=> Math.abs(x.p.total) >= 0.005);
    if(!computed.length) return;
    const ws = wb.addWorksheet(name, {properties:{tabColor:{argb: isWeld?'FFC1453C':CLR.teal}}});
    ws.columns = wsWidths.map(w=>({width:w}));
    styleTitleRow(ws, 1, 11);
    ws.getCell(1,1).value = name.toUpperCase() + (isWeld ? ' (WELDON) — Fusion Joints & Pricing' : ' — Joints & Pricing');
    ws.getRow(2).values = wsHeaders;
    styleHeaderRow(ws, 2, 11);
    let rr = 3, a=false, total=0;
    computed.forEach(({row,joints,qpj,kgqty,p})=>{
      ws.getRow(rr).values = [row.size, round2(qpj), round2(kgqty), joints, row.dry];
      ws.getCell(rr,6).value = {formula:`E${rr}*${AS.vat}`};
      ws.getCell(rr,7).value = {formula:`E${rr}*${AS.inst}`};
      ws.getCell(rr,8).value = {formula:`E${rr}+F${rr}+G${rr}`};
      ws.getCell(rr,9).value = {formula:`H${rr}*${AS.prof}`};
      ws.getCell(rr,10).value = {formula:`H${rr}+I${rr}`};
      ws.getCell(rr,11).value = {formula:`J${rr}*C${rr}`};
      for(const c of [5,6,7,8,9,10,11]) ws.getCell(rr,c).numFmt = '#,##0.00';
      styleDataRow(ws, rr, 11, a);
      a = !a; total += p.total; rr++;
    });
    ws.getCell(rr,10).value = 'TOTAL';
    ws.getCell(rr,11).value = {formula:`SUM(K3:K${rr-1})`};
    ws.getCell(rr,11).numFmt = '#,##0.00';
    styleTotalRow(ws, rr, 11);
    ws.views = [{state:'frozen', ySplit:2}];
  }
  buildWSSheet('Welding', DATA.weld, null, true);
  buildWSSheet('Solvent', DATA.solv, DATA.weld, false);
  buildWSSheet('Valves Welding', VALVE_DATA.weld, null, true);
  buildWSSheet('Valves Solvent', VALVE_DATA.solv, VALVE_DATA.weld, false);

  /* ---- Summary sheet (Pipe + Valves combined) ---- */
  const pipeCalc = computeGroupTotals(GROUP_CFG.Pipe);
  const valveCalc = computeGroupTotals(GROUP_CFG.Valve);
  const wsS = wb.addWorksheet('Summary', {properties:{tabColor:{argb:CLR.amberDark}}});
  wsS.columns = [{width:28},{width:20}];
  styleTitleRow(wsS, 1, 2);
  wsS.getCell(1,1).value = 'SUMMARY — Total Costs by Category';
  wsS.getRow(2).values = ['Category','Total Price (EGP)'];
  styleHeaderRow(wsS, 2, 2);
  let rr = 3, grand = 0, a=false;
  function summarySection(title){ styleSectionRow(wsS, rr, 2, title); rr++; a=false; }
  function summaryRow(name, val){
    wsS.getRow(rr).values = [name, round2(val)];
    wsS.getCell(rr,2).numFmt = '#,##0.00';
    styleDataRow(wsS, rr, 2, a);
    a = !a; grand += val; rr++;
  }
  const pipeRows = CATS.map(cat=>[getCatLabel(cat), pipeCalc.catTotals[cat]])
    .concat([['Welding', pipeCalc.weldTotal],['Solvent', pipeCalc.solvTotal]])
    .filter(([,v])=> Math.abs(v)>=0.005);
  if(pipeRows.length){ summarySection('PIPE & FITTINGS'); pipeRows.forEach(([n,v])=> summaryRow(n,v)); }
  const valveRows = VALVE_CATS.map(cat=>[getCatLabel(cat), valveCalc.catTotals[cat]])
    .concat([['Valves Welding', valveCalc.weldTotal],['Valves Solvent', valveCalc.solvTotal]])
    .filter(([,v])=> Math.abs(v)>=0.005);
  if(valveRows.length){ summarySection('VALVES & ACCESSORIES'); valveRows.forEach(([n,v])=> summaryRow(n,v)); }
  wsS.getCell(rr,1).value = 'GRAND TOTAL';
  wsS.getCell(rr,2).value = round2(grand);
  wsS.getCell(rr,2).numFmt = '#,##0.00';
  styleTotalRow(wsS, rr, 2);
  wsS.getCell(rr,1).font = {bold:true, size:12, color:{argb:CLR.navy}};
  wsS.getCell(rr,2).font = {bold:true, size:12, color:{argb:CLR.navy}};

  const wsD = wb.addWorksheet('Diameter Summary', {properties:{tabColor:{argb:CLR.teal}}});
  wsD.columns = [{width:14},{width:16},{width:16},{width:16},{width:16},{width:20},{width:20},{width:22},{width:26},{width:22}];
  const diaPipeCost = {}, diaElbow90 = {}, diaElbow45 = {}, diaTee = {}, diaOtherPipeSide = {}, diaValves = {}, diaLen = {};
  const diaWeldP = {}, diaSolvP = {}, diaWeldV = {}, diaSolvV = {};
  DIAMS.forEach(d=>{
    diaPipeCost[d]=0; diaElbow90[d]=0; diaElbow45[d]=0; diaTee[d]=0; diaOtherPipeSide[d]=0; diaValves[d]=0; diaLen[d]=0;
    diaWeldP[d]=0; diaSolvP[d]=0; diaWeldV[d]=0; diaSolvV[d]=0;
  });
  function diaAccumulate(target, rowTotalSrc, cat, rows){
    rows.forEach(row=>{
      const d = normSize(row.size);
      if(target.hasOwnProperty(d)) target[d] += rowTotalSrc[cat+'_'+row.orig_row]||0;
    });
  }
  diaAccumulate(diaPipeCost, pipeCalc.rowTotal, 'Pipe', DATA.cats['Pipe']);
  diaAccumulate(diaElbow90, pipeCalc.rowTotal, 'Elbow 90', DATA.cats['Elbow 90']);
  diaAccumulate(diaElbow45, pipeCalc.rowTotal, 'Elbow 45', DATA.cats['Elbow 45']);
  diaAccumulate(diaTee, pipeCalc.rowTotal, 'Tee', DATA.cats['Tee']);
  diaAccumulate(diaOtherPipeSide, pipeCalc.rowTotal, 'Reducer', DATA.cats['Reducer']);
  diaAccumulate(diaOtherPipeSide, pipeCalc.rowTotal, 'Bush', DATA.cats['Bush']);
  diaAccumulate(diaWeldP, pipeCalc.rowTotal, GROUP_CFG.Pipe.weldKind, DATA.weld);
  diaAccumulate(diaSolvP, pipeCalc.rowTotal, GROUP_CFG.Pipe.solvKind, DATA.solv);
  VALVE_CATS.forEach(cat=> diaAccumulate(diaValves, valveCalc.rowTotal, cat, VALVE_DATA.cats[cat]));
  diaAccumulate(diaWeldV, valveCalc.rowTotal, GROUP_CFG.Valve.weldKind, VALVE_DATA.weld);
  diaAccumulate(diaSolvV, valveCalc.rowTotal, GROUP_CFG.Valve.solvKind, VALVE_DATA.solv);
  DATA.cats['Pipe'].forEach(row=>{
    const d = normSize(row.size);
    if(diaLen.hasOwnProperty(d)) diaLen[d] += Number(row.qty)||0;
  });

  const diamsSmall = DIAMS.filter(d=> d < DIA_SPLIT_MIN);
  const diamsBig = DIAMS.filter(d=> d >= DIA_SPLIT_MIN);
  const setMoney = (r, cols) => cols.forEach(c=>{ wsD.getCell(r,c).numFmt = '#,##0.00'; });
  let rrD = 1;

  styleTitleRow(wsD, rrD, 8);
  wsD.getCell(rrD,1).value = 'DIAMETERS BELOW 250 MM — COMBINED PIPE + FITTINGS (NO VALVES)';
  rrD++;
  wsD.getRow(rrD).values = ['Diameter','Pipe Length (m)','Pipe Cost (EGP)','Welding (EGP)','Solvent (EGP)','Total Cost — Pipe+Fittings (EGP)','Cost/Meter — Pipe only (EGP/m)','Cost/Meter — Pipe+Fittings (EGP/m)'];
  styleHeaderRow(wsD, rrD, 8);
  rrD++;
  let aRow=false, subPipeA=0, subWeldA=0, subSolvA=0, subTotalA=0;
  diamsSmall.forEach(d=>{
    const len = diaLen[d]||0, pipeCost = diaPipeCost[d]||0;
    const weld = diaWeldP[d]||0, solv = diaSolvP[d]||0;
    const combined = pipeCost + (diaElbow90[d]||0) + (diaElbow45[d]||0) + (diaTee[d]||0) + (diaOtherPipeSide[d]||0) + weld + solv;
    if(Math.abs(len) < 0.005 && Math.abs(combined) < 0.005) return;
    const cpmPipe = len>0 ? pipeCost/len : null, cpmAll = len>0 ? combined/len : null;
    wsD.getRow(rrD).values = [d+' mm', round2(len), round2(pipeCost), round2(weld), round2(solv), round2(combined), cpmPipe!==null?round2(cpmPipe):'—', cpmAll!==null?round2(cpmAll):'—'];
    setMoney(rrD, [2,3,4,5,6]);
    if(cpmPipe!==null) setMoney(rrD, [7]);
    if(cpmAll!==null) setMoney(rrD, [8]);
    styleDataRow(wsD, rrD, 8, aRow);
    aRow = !aRow; subPipeA += pipeCost; subWeldA += weld; subSolvA += solv; subTotalA += combined; rrD++;
  });
  wsD.getCell(rrD,1).value = 'SUBTOTAL';
  wsD.getCell(rrD,3).value = round2(subPipeA);
  wsD.getCell(rrD,4).value = round2(subWeldA);
  wsD.getCell(rrD,5).value = round2(subSolvA);
  wsD.getCell(rrD,6).value = round2(subTotalA);
  setMoney(rrD, [3,4,5,6]);
  styleTotalRow(wsD, rrD, 8);
  rrD += 2;

  styleTitleRow(wsD, rrD, 10);
  wsD.getCell(rrD,1).value = 'DIAMETERS 250 MM AND ABOVE — SPLIT BY CATEGORY';
  rrD++;
  wsD.getRow(rrD).values = ['Diameter','Pipe Length (m)','Pipe Cost (EGP)','Elbow 90 (EGP)','Elbow 45 (EGP)','Tee (EGP)','Welding (EGP)','Solvent (EGP)','Other — Reducer+Bush+Valves (EGP)','Total — All Categories (EGP)'];
  styleHeaderRow(wsD, rrD, 10);
  rrD++;
  let bRow=false, subPipeB=0, grandE90=0, grandE45=0, grandTee=0, grandWeld=0, grandSolv=0, grandOther=0, subTotalB=0;
  diamsBig.forEach(d=>{
    const len = diaLen[d]||0, pipeCost = diaPipeCost[d]||0;
    const e90 = diaElbow90[d]||0, e45 = diaElbow45[d]||0, tee = diaTee[d]||0;
    const weld = (diaWeldP[d]||0) + (diaWeldV[d]||0), solv = (diaSolvP[d]||0) + (diaSolvV[d]||0);
    const other = (diaOtherPipeSide[d]||0) + (diaValves[d]||0);
    const total = pipeCost + e90 + e45 + tee + weld + solv + other;
    if(Math.abs(len) < 0.005 && Math.abs(total) < 0.005) return;
    wsD.getRow(rrD).values = [d+' mm', round2(len), round2(pipeCost), round2(e90), round2(e45), round2(tee), round2(weld), round2(solv), round2(other), round2(total)];
    setMoney(rrD, [2,3,4,5,6,7,8,9,10]);
    styleDataRow(wsD, rrD, 10, bRow);
    bRow = !bRow; subPipeB += pipeCost; grandE90 += e90; grandE45 += e45; grandTee += tee; grandWeld += weld; grandSolv += solv; grandOther += other; subTotalB += total; rrD++;
  });
  wsD.getCell(rrD,1).value = 'SUBTOTAL';
  wsD.getCell(rrD,3).value = round2(subPipeB);
  wsD.getCell(rrD,4).value = round2(grandE90);
  wsD.getCell(rrD,5).value = round2(grandE45);
  wsD.getCell(rrD,6).value = round2(grandTee);
  wsD.getCell(rrD,7).value = round2(grandWeld);
  wsD.getCell(rrD,8).value = round2(grandSolv);
  wsD.getCell(rrD,9).value = round2(grandOther);
  wsD.getCell(rrD,10).value = round2(subTotalB);
  setMoney(rrD, [3,4,5,6,7,8,9,10]);
  styleTotalRow(wsD, rrD, 10);
  rrD += 2;

  wsD.getCell(rrD,1).value = 'GRAND TOTAL — ALL DIAMETERS COMBINED';
  wsD.getCell(rrD,1).font = {bold:true, size:12};
  wsD.getCell(rrD,6).value = round2(subTotalA + subTotalB);
  wsD.getCell(rrD,6).numFmt = '#,##0.00';
  wsD.getCell(rrD,6).font = {bold:true, size:12};
  wsD.views = [{state:'frozen', ySplit:0}];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const linkEl = document.createElement('a');
  linkEl.href = url; linkEl.download = 'Pipe_Valve_Costing.xlsx';
  document.body.appendChild(linkEl); linkEl.click(); document.body.removeChild(linkEl);
  URL.revokeObjectURL(url);
}

/* Print: hide empty rows/tabs that have no values */
function markEmptyForPrint(){
  document.querySelectorAll('.tab-panel').forEach(function(panel){
    if(panel.id === 'panel_PriceList' || panel.id === 'panel_VPriceList') return; // already hidden entirely via CSS
    var rows = panel.querySelectorAll('tbody tr');
    var anyVisible = false;
    rows.forEach(function(tr){
      tr.classList.remove('print-hide-row');
      if(tr.classList.contains('section-row')) return; // section headers (only appear in Price List)
      var totalEl = tr.querySelector('[id^="c_total_"], [id^="sum_"], [id^="dia_cost_"], [id^="dia_totalB_"]');
      var val = totalEl ? (parseFloat((totalEl.textContent||'0').replace(/,/g,'')) || 0) : null;
      if(val !== null){
        if(Math.abs(val) < 0.005){
          tr.classList.add('print-hide-row');
        } else {
          anyVisible = true;
        }
      } else {
        anyVisible = true; // no total column to measure against - keep visible as a fallback
      }
    });
    panel.classList.toggle('print-hide-panel', rows.length > 0 && !anyVisible);
  });
}
window.addEventListener('beforeprint', markEmptyForPrint);

function printDoc(){
  markEmptyForPrint();
  window.print();
}

function brandMarkSvg(){
  return '<svg width="46" height="46" viewBox="0 0 46 46">'+
    '<circle cx="23" cy="23" r="20" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>'+
    '<circle cx="23" cy="23" r="12" fill="none" stroke="#E3B57A" stroke-width="3"/>'+
    '<circle cx="23" cy="23" r="4" fill="#E3B57A"/>'+
  '</svg>';
}

function init(){
  var bm = document.getElementById('brandMark'); if(bm) bm.innerHTML = brandMarkSvg();
  document.getElementById('vatInput').value = round2(assump.vat*100);
  document.getElementById('instInput').value = round2(assump.inst*100);
  document.getElementById('profInput').value = round2(assump.prof*100);
  document.getElementById('vatInput').addEventListener('input', function(){ assump.vat = (Number(this.value)||0)/100; saveDryPrices(); recalcAll(); });
  document.getElementById('instInput').addEventListener('input', function(){ assump.inst = (Number(this.value)||0)/100; saveDryPrices(); recalcAll(); });
  document.getElementById('profInput').addEventListener('input', function(){ assump.prof = (Number(this.value)||0)/100; saveDryPrices(); recalcAll(); });
  const resetBtn = document.getElementById('resetPricesBtn');
  if(resetBtn) resetBtn.addEventListener('click', resetSavedPrices);
  const resetQtyBtn = document.getElementById('resetQtyBtn');
  if(resetQtyBtn) resetQtyBtn.addEventListener('click', resetAllQuantities);

  const saveProjectBtn = document.getElementById('saveProjectBtn');
  if(saveProjectBtn) saveProjectBtn.addEventListener('click', function(){
    const name = prompt('Enter a name for this calculation (saves all current quantities and prices):', 'Project - ' + new Date().toLocaleDateString());
    if(name && name.trim()){
      const ok = saveProjectAs(name.trim());
      alert(ok ? 'Calculation saved as: '+name.trim() : 'There was a problem saving. Please try again.');
    }
  });

  const openSavedBtn = document.getElementById('openSavedBtn');
  const savedModalOverlay = document.getElementById('savedModalOverlay');
  const savedModalCloseBtn = document.getElementById('savedModalCloseBtn');
  if(openSavedBtn) openSavedBtn.addEventListener('click', function(){
    renderSavedProjectsList();
    savedModalOverlay.classList.add('open');
  });
  if(savedModalCloseBtn) savedModalCloseBtn.addEventListener('click', function(){
    savedModalOverlay.classList.remove('open');
  });
  if(savedModalOverlay) savedModalOverlay.addEventListener('click', function(e){
    if(e.target === savedModalOverlay) savedModalOverlay.classList.remove('open');
  });

  const backupBtn = document.getElementById('backupBtn');
  if(backupBtn) backupBtn.addEventListener('click', downloadBackup);
  const restoreBtn = document.getElementById('restoreBtn');
  const restoreFile = document.getElementById('restoreFile');
  if(restoreBtn && restoreFile){
    restoreBtn.addEventListener('click', function(){ restoreFile.value = ''; restoreFile.click(); });
    restoreFile.addEventListener('change', function(){
      const f = this.files && this.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = function(){ restoreBackupFromText(String(reader.result||'')); };
      reader.readAsText(f);
    });
  }

  initTabsAndPanels();
  recalcAll();
  offerAutosaveRestore();

  document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
  document.getElementById('printBtn').addEventListener('click', printDoc);
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
