<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe &amp; Valve Cost Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --navy-950:#0B1220; --navy-900:#101B30; --navy-800:#1B2C48; --navy-700:#28406A; --navy-line:#33507C;
    --brass-300:#F0C48A; --brass-500:#D69A4E; --brass-600:#B67B33; --steel-500:#5B95A0; --steel-300:#8FC2CB;
    --amber-500:#D69A4E; --amber-600:#B67B33; --teal-500:#5B95A0;
    --paper:#F7F2E9; --panel:#FFFFFF; --ink:#1B2434; --ink-soft:#63707E;
    --line:#E7E0D2; --line-soft:#F1ECE1;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --display: "Oswald", "Segoe UI", system-ui, sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--ink);font-family:var(--sans);
    background:
      radial-gradient(900px 500px at 8% -8%, rgba(214,154,78,.10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(91,149,160,.12), transparent 55%),
      repeating-linear-gradient(0deg, rgba(27,44,72,.025) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(90deg, rgba(27,44,72,.025) 0 1px, transparent 1px 30px),
      var(--paper);
  }
  .app{max-width:1500px;margin:0 auto;padding:24px 20px 60px;}

  /* ---------- Header: soft instrument panel ---------- */
  .topbar{
    display:flex;flex-direction:column;gap:0;
    border-radius:var(--r-lg);color:#fff;
    background:
      radial-gradient(600px 260px at 12% 0%, rgba(214,154,78,.16), transparent 60%),
      radial-gradient(600px 300px at 100% 100%, rgba(91,149,160,.18), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 40%),
      var(--navy-950);
    box-shadow:0 14px 34px rgba(11,18,32,.28);
    position:relative;overflow:hidden;
    border:1px solid var(--navy-line);
  }
  .topbar::before{ /* fine blueprint grid, softened */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(240,196,138,.05) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(240,196,138,.05) 0 1px, transparent 1px 24px);
    -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.2));
            mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.2));
  }
  .topbar-main{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:22px 28px 20px;position:relative;z-index:1;}
  .corner-tick{display:none;}
  .brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .brand-mark{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25));}
  .brand-text .eyebrow{display:block;font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--brass-300);margin-bottom:3px;}
  .brand-text h1{margin:0;font-family:var(--display);font-size:24px;letter-spacing:2px;color:#fff;font-weight:700;text-transform:uppercase;}
  .brand-text .subtitle{font-size:12px;color:rgba(255,255,255,.68);letter-spacing:.2px;}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:1;}

  .btn{
    border:1px solid var(--navy-line);background:rgba(255,255,255,.05);
    color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    font-family:var(--display);letter-spacing:.6px;text-transform:uppercase;
  }
  .btn svg{width:15px;height:15px;flex:none;}
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.2);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg, var(--brass-300), var(--brass-500));color:var(--navy-950);border-color:var(--brass-500);}
  .btn.primary:hover{background:linear-gradient(135deg, var(--brass-300), var(--brass-300));box-shadow:0 8px 18px rgba(214,154,78,.35);}

  /* ---------- signature: animated pipeline flow-line ---------- */
  .flow-rail{position:relative;height:20px;z-index:1;padding:0 28px;overflow:hidden;}
  .flow-rail .rail-line{position:absolute;left:28px;right:28px;top:9px;height:2px;background:var(--navy-line);}
  .flow-rail .rail-node{position:absolute;top:5px;width:10px;height:10px;border-radius:50%;background:var(--navy-950);border:2px solid var(--brass-500);transform:translateX(-50%);}
  .flow-rail .rail-pulse{
    position:absolute;top:8px;height:4px;width:160px;border-radius:2px;
    background:linear-gradient(90deg, rgba(227,181,122,0), var(--brass-300) 45%, var(--brass-500) 55%, rgba(227,181,122,0));
    animation:flowPulse 5s linear infinite;
  }
  @keyframes flowPulse{
    0%{left:-160px;}
    100%{left:100%;}
  }
  @media (prefers-reduced-motion: reduce){
    .flow-rail .rail-pulse{animation:none;display:none;}
  }

  /* ---------- Summary cards ---------- */
  .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 20px;}
  .summary-card{
    background:linear-gradient(180deg, #FFFFFF, #FFFDF8);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px 15px;
    display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;
    box-shadow:0 2px 10px rgba(27,44,72,.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .summary-card::before{content:"";position:absolute;top:0;left:14px;right:14px;height:4px;border-radius:0 0 var(--r-pill) var(--r-pill);background:linear-gradient(90deg, var(--brass-300), var(--brass-500));}
  .summary-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(27,44,72,.12);}
  .summary-card.grand{background:linear-gradient(160deg, var(--navy-900), var(--navy-950));border-color:var(--navy-line);}
  .summary-card.grand::before{background:linear-gradient(90deg, var(--brass-300), var(--steel-300));}
  .summary-card.grand .label{color:var(--brass-300);}
  .summary-card.grand .value{color:#fff;}
  .summary-card .label{font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .summary-card .value{font-size:19px;font-weight:700;color:var(--navy-900);font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* ---------- Assumptions bar ---------- */
  .assump-bar{
    display:flex;gap:24px;padding:16px 22px;border-radius:var(--r-md);margin-bottom:20px;flex-wrap:wrap;align-items:center;
    background:linear-gradient(135deg, var(--navy-900), var(--navy-950));
    box-shadow:0 8px 20px rgba(11,18,32,.16);
    border:1px solid var(--navy-line);
  }
  .assump-field label{display:block;font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--brass-300);margin-bottom:5px;font-weight:600;}
  .assump-field input{width:90px;background:rgba(255,255,255,.07);border:1px solid var(--navy-line);color:#fff;padding:8px 12px;border-radius:var(--r-sm);font-size:13px;font-family:var(--mono);}
  .assump-field input:focus{outline:2px solid var(--brass-300);outline-offset:1px;}
  .assump-note{color:#9AABBB;font-size:12px;margin-left:auto;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap;
    background:var(--panel);padding:7px;border-radius:var(--r-md);border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(27,44,72,.05);
  }
  .tab-btn{
    border:none;background:transparent;padding:9px 16px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;letter-spacing:.4px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
    font-family:var(--display);text-transform:uppercase;
  }
  .tab-btn:hover{background:var(--line-soft);color:var(--navy-900);}
  .tab-btn.active{
    background:linear-gradient(135deg, var(--navy-800), var(--navy-950));
    color:#fff;box-shadow:0 4px 12px rgba(16,27,48,.25);
  }
  .tab-btn.main{font-size:13px;padding:11px 22px;}
  .tabs.subtabs{background:transparent;border:none;box-shadow:none;padding:0 0 4px;margin-bottom:14px;gap:8px;}
  .tab-btn.sub{background:var(--panel);border:1px solid var(--line);color:var(--navy-900);font-size:11.5px;padding:7px 15px;}
  .tab-btn.sub:hover{background:var(--line-soft);}
  .tab-btn.sub.active{background:linear-gradient(135deg, var(--brass-300), var(--brass-500));color:var(--navy-950);border-color:var(--brass-500);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .tab-panel.active{animation:none;}
  }

  .panel-toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .hint{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .print-heading{display:none;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:auto;box-shadow:0 4px 16px rgba(27,44,72,.06);max-height:70vh;}
  table{border-collapse:collapse;width:100%;min-width:760px;}
  thead th{background:linear-gradient(135deg, var(--navy-800), var(--navy-950));color:#fff;font-family:var(--display);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:500;padding:11px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2;}
  thead th.left{text-align:left;padding-left:12px;}
  tbody td{padding:7px 6px;border-bottom:1px solid var(--line-soft);text-align:center;font-size:13px;}
  tbody tr:nth-child(even){background:#FBF8F1;}
  tbody tr:hover{background:#F4EFE3;}
  tbody tr.section-row td{
    background:linear-gradient(90deg, var(--brass-500), var(--brass-300));
    color:var(--navy-950);font-family:var(--display);font-weight:600;text-align:left;padding-left:12px;
    text-transform:uppercase;font-size:11px;letter-spacing:.8px;border-bottom:1px solid var(--brass-600);
  }
  td.left{text-align:left;padding-left:10px;font-weight:700;color:var(--navy-900);white-space:nowrap;}
  input[type=number]{width:100%;min-width:66px;border:1px solid var(--brass-500);border-radius:var(--r-sm);padding:6px 8px;font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--ink);background:#FFFDF8;transition:box-shadow .12s ease, border-color .12s ease;}
  input[type=number]:focus{outline:none;border-color:var(--brass-300);box-shadow:0 0 0 3px rgba(214,154,78,.28);}
  .computed{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;}
  .computed.strong{font-weight:700;color:var(--navy-900);}
  tfoot td{background:var(--line-soft);font-weight:700;color:var(--navy-900);padding:10px 6px;text-align:center;font-family:var(--mono);border-top:2px solid var(--brass-500);}
  tfoot td.left{text-align:right;padding-right:14px;font-family:var(--display);text-transform:uppercase;letter-spacing:.6px;font-size:11.5px;}

  footer.tool-footer{margin-top:26px;font-size:11px;color:var(--ink-soft);text-align:center;font-family:var(--display);letter-spacing:.6px;text-transform:uppercase;}

  @media (max-width:720px){
    .summary-bar{grid-template-columns:1fr 1fr;}
    .topbar-main{flex-direction:column;align-items:flex-start;gap:14px;}
    .flow-rail{display:none;}
  }

/* ================= PRINT ================= */
@page{ size:landscape; margin:12mm; }
@media print{
  html,body{background:#fff;}
  .app{max-width:100%;padding:0;}

  /* اخفي أي حاجة مالهاش لازمة في الورق */
  .actions, .tabs, .panel-toolbar, .assump-note, .corner-tick, .flow-rail{display:none !important;}

  /* اطبع كل تاب كامل ورا التاني، مش بس الفاتح */
  .tab-panel{display:block !important;break-inside:avoid-page;margin:0 0 12px;animation:none !important;}
  /* من غير فصل صفحة إجباري بعد كل تاب — الجداول بقت قصيرة (صفوف/تابات فاضية اتشالت) فتقدر تتجمع في نفس الصفحة */
  .print-heading{display:block !important;font-family:var(--display);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--navy-900);margin:0 0 4px;padding-bottom:3px;border-bottom:2px solid var(--brass-500);}

  /* الهيدر: يرجع لون ثابت بدل الجراديانت المتحرك (الأنيميشن مبيتطبعش أصلاً) */
  .topbar{
    background:var(--navy-950) !important;animation:none !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    box-shadow:none;border-radius:0;border:none;margin-bottom:10px;
  }
  .topbar::before{display:none;}
  .topbar-main{padding:14px 4px;}
  .assump-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:0;}
  .summary-card{box-shadow:none;break-inside:avoid;}
  .summary-card.grand{-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* الجداول: شيل السكرول عشان الجدول يطبع كامل مش بس الجزء الظاهر */
  .table-wrap{max-height:none !important;overflow:visible !important;border:1px solid #999;box-shadow:none;border-radius:0;}
  table{width:100%;min-width:0;}
  thead th, tbody td{padding:4px 5px;font-size:10.5px;}

  /* اظهر بس الأعمدة المهمة (الصنف/المقاس/الوحدة/الكمية + السعر النهائي)، واخفي التفاصيل الوسطى (Dry/Vat/Install/Concept/Profit/Unit Rate) */
  .table-wrap table thead th:nth-child(n+5):nth-child(-n+10),
  .table-wrap table tbody td:nth-child(n+5):nth-child(-n+10){
    display:none !important;
  }
  thead{display:table-header-group;} /* هيدر الأعمدة يتكرر في كل صفحة */
  tr{page-break-inside:avoid;break-inside:avoid;}
  thead th, tbody tr.section-row td, tfoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* خانات الإدخال: تتطبع كنص عادي مش كصندوق فاضي */
  input[type=number]{
    border:none !important;background:transparent !important;box-shadow:none !important;
    -webkit-appearance:none;appearance:none;padding:0;font-weight:700;color:var(--ink);
  }

  footer.tool-footer{display:none;}

  /* اخفي صفحة/تاب قايمة الأسعار بالكامل من الطباعة */
  #panel_PriceList, #panel_VPriceList{display:none !important;}

  /* اخفي أي صف فاضي (من غير كمية/قيمة) عشان الطباعة تبقى مختصرة، وكمان اخفي أي تاب فاضي بالكامل */
  tr.print-hide-row{display:none !important;}
  .tab-panel.print-hide-panel{display:none !important;}

  /* طباعة ذكية: اخفي أعمدة التكاليف الوسيطة (Dry / Vat / Install & Transport / Concept / Profit)
     ونسيب بس اللي مهم: الصنف/المقاس/الوحدة/الكمية + السعر النهائي (Unit Rate + Total Price) */
  table.cat-table thead th:nth-child(5), table.cat-table tbody td:nth-child(5),
  table.cat-table thead th:nth-child(6), table.cat-table tbody td:nth-child(6),
  table.cat-table thead th:nth-child(7), table.cat-table tbody td:nth-child(7),
  table.cat-table thead th:nth-child(8), table.cat-table tbody td:nth-child(8),
  table.cat-table thead th:nth-child(9), table.cat-table tbody td:nth-child(9){
    display:none !important;
  }

  /* جداول اللحام والصلفنت: نسيب بس المقاس + عدد الوصلات + السعر النهائي */
  table.ws-table thead th:nth-child(2), table.ws-table tbody td:nth-child(2),
  table.ws-table thead th:nth-child(3), table.ws-table tbody td:nth-child(3),
  table.ws-table thead th:nth-child(5), table.ws-table tbody td:nth-child(5),
  table.ws-table thead th:nth-child(6), table.ws-table tbody td:nth-child(6),
  table.ws-table thead th:nth-child(7), table.ws-table tbody td:nth-child(7),
  table.ws-table thead th:nth-child(8), table.ws-table tbody td:nth-child(8),
  table.ws-table thead th:nth-child(9), table.ws-table tbody td:nth-child(9){
    display:none !important;
  }
}
  
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="corner-tick tl"></div>
    <div class="corner-tick tr"></div>
    <div class="topbar-main">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-text">
          <span class="eyebrow">CES — Engineering Cost Module</span>
          <h1>Pipe &amp; Valve Cost Engine</h1>
          <span class="subtitle">Pipes, Fittings &amp; Valves ( Cost Estimation for Pipe Line Accessories &amp; Fittings )</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg> Print / PDF</button>
        <button class="btn primary" id="exportExcelBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> Export Excel</button>
      </div>
    </div>
    <div class="flow-rail" aria-hidden="true">
      <div class="rail-line"></div>
      <div class="rail-node" style="left:6%"></div>
      <div class="rail-node" style="left:22%"></div>
      <div class="rail-node" style="left:38%"></div>
      <div class="rail-node" style="left:54%"></div>
      <div class="rail-node" style="left:70%"></div>
      <div class="rail-node" style="left:86%"></div>
      <div class="rail-pulse"></div>
    </div>
  </div>

  <div class="assump-bar">
    <div class="assump-field"><label>VAT %</label><input type="number" id="vatInput" step="0.1"></div>
    <div class="assump-field"><label>Installation &amp; Transport %</label><input type="number" id="instInput" step="0.1"></div>
    <div class="assump-field"><label>Profit %</label><input type="number" id="profInput" step="0.1"></div>
    <div class="assump-note">                 </div>
  </div>

  <div class="summary-bar" id="summaryBar"></div>

  <nav class="tabs" id="tabsNav"></nav>
  <nav class="tabs subtabs" id="subTabsNav"></nav>

  <div id="panels"></div>

  <footer class="tool-footer">Created by: Eng. Hesham Mohamed</footer>

  return w.contrib.reduce((sum,c)=> sum + c.coeff*qtyOf(c.cat, c.row), 0);
}

function pricing(dry, qty){
  const vatAmt = dry*assump.vat;
  const instAmt = dry*assump.inst;
  const concept = dry+vatAmt+instAmt;
  const profAmt = concept*assump.prof;
  const unitRate = concept+profAmt;
  const total = unitRate*qty;
  return {vatAmt, instAmt, concept, profAmt, unitRate, total};
}

/* ---------- DOM builders ---------- */
function el(tag, attrs, html){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function buildCatTable(cat){
  const wrap = el('div',{class:'table-wrap'});
  const table = el('table',{id:'tbl_'+cat, class:'cat-table'});
  const thead = el('thead');
  const trh = el('tr');
  CAT_HEAD.forEach((h,i)=> trh.appendChild(el('th',{class:i<3?'left':''}, h)));
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = el('tbody');
  getCatRows(cat).forEach(r=>{
    const tr = el('tr');
    tr.appendChild(el('td',{class:'left'}, r.item||''));
    tr.appendChild(el('td',{class:'left'}, r.size||''));
    tr.appendChild(el('td',{class:'left'}, r.unit||''));
    const qtyTd = el('td');
    const qtyInput = el('input',{type:'number',step:'1',id:'q_'+cat+'_'+r.orig_row,value:r.qty});
    qtyInput.addEventListener('input', function(){ r.qty = Number(this.value)||0; recalcAll(); });
    if(cat==='Pipe'){
      qtyInput.setAttribute('title','Rounds up to the nearest multiple of 6 (standard pipe length) when you finish typing.');
      qtyInput.addEventListener('blur', function(){
        const val = Number(this.value)||0;
        if(val>0){
          const rounded = Math.ceil(val/6)*6;
          this.value = rounded;
          r.qty = rounded;
          recalcAll();
        }
      });
      qtyInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ this.blur(); } });
    }
    qtyTd.appendChild(qtyInput);
    tr.appendChild(qtyTd);
    ['dry','vat','inst','concept','prof','rate','total'].forEach(f=>{
      tr.appendChild(el('td',{}, el('span',{class:'computed'+(f==='total'?' strong':''), id:'c_'+f+'_'+cat+'_'+r.orig_row}, '0.00').outerHTML));

  trf.appendChild(el('td',{}, el('span',{id:'tot_'+cat}, '0.00').outerHTML));
  tfoot.appendChild(trf);
  table.appendChild(tfoot);
  wrap.appendChild(table);
  return wrap;
}

function buildLeafPanel(mainId, leaf){
  const panel = el('section',{id:'panel_'+leaf.id, class:'tab-panel'});
  if(leaf.id!=='PriceList' && leaf.id!=='VPriceList'){
    panel.appendChild(el('h3',{class:'print-heading'}, leaf.label));
  }
  if(leaf.id==='PriceList'){
    panel.appendChild(toolbar('Price List'));
    panel.appendChild(buildPriceListTable('Pipe'));
  } else if(leaf.id==='VPriceList'){
    panel.appendChild(toolbar('Price List'));
    panel.appendChild(buildPriceListTable('Valve'));
  } else if(CATS.includes(leaf.id)){
    const hintText = leaf.id==='Pipe' ? 'Qty = Pipe Length in Meters ( m ).' : 'Qty = No of Fittings';
    panel.appendChild(toolbar(hintText));
    panel.appendChild(buildCatTable(leaf.id));
  } else if(VALVE_CATS.includes(leaf.id)){
    const hintText = leaf.id==='BallValve' ? 'Qty = No of Units' : 'Qty = No of Units';
    panel.appendChild(toolbar(hintText));
    panel.appendChild(buildCatTable(leaf.id));
  } else if(leaf.id==='Weld'){
    panel.appendChild(toolbar('(2 ends/Elbow, 3/Tee, 2/Reducer or Bush).'));
    panel.appendChild(buildWSTable('Weld'));
  } else if(leaf.id==='Solv'){
    panel.appendChild(toolbar('Same joint count as Welding, at half the material rate per joint.'));
    panel.appendChild(buildWSTable('Solv'));
  } else if(leaf.id==='VWeld'){
    panel.appendChild(toolbar('Joints from Ball Valve, Check Valve, Socket &amp; Puddle Flange (2 ends each).'));
    panel.appendChild(buildWSTable('VWeld'));
  } else if(leaf.id==='VSolv'){
    panel.appendChild(toolbar('Same joint count as Valves Welding, at half the material rate per joint.'));
    panel.appendChild(buildWSTable('VSolv'));
  } else if(leaf.id==='Summary'){
    panel.appendChild(buildSummaryTable('Pipe'));
  } else if(leaf.id==='VSummary'){
    panel.appendChild(buildSummaryTable('Valve'));
  } else if(leaf.id==='DiaSummary'){
    panel.appendChild(toolbar('Combined Pipe + Fittings + Valves cost per diameter, divided by the pipe length entered for that diameter (Pipe tab).'));
    panel.appendChild(buildDiameterSummaryTable());
  }
  return panel;
}

function showLeafPanel(leafId){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('panel_'+leafId);
  if(panel) panel.classList.add('active');
}

function renderSubNav(mainId){
  const subNav = document.getElementById('subTabsNav');
  subNav.innerHTML = '';
  const leaves = LEAF_DEFS[mainId];
  if(leaves.length<=1){ subNav.style.display='none'; showLeafPanel(leaves[0].id); return; }
  subNav.style.display='flex';
  leaves.forEach((leaf,i)=>{
    const btn = el('button',{class:'tab-btn sub'+(i===0?' active':''), 'data-tab':leaf.id}, '<span>'+leaf.label+'</span>');
    btn.addEventListener('click', function(){
      subNav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      showLeafPanel(this.dataset.tab);
    });
    subNav.appendChild(btn);
  });
  showLeafPanel(leaves[0].id);
}

function initTabsAndPanels(){
  const nav = document.getElementById('tabsNav');
  const panels = document.getElementById('panels');
  MAIN_TABS.forEach((m,i)=>{
    const btn = el('button',{class:'tab-btn main'+(i===0?' active':''), 'data-tab':m.id}, '<span>'+m.label+'</span>');
    btn.addEventListener('click', function(){
      nav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      renderSubNav(this.dataset.tab);
    });
    nav.appendChild(btn);
    LEAF_DEFS[m.id].forEach(leaf=> panels.appendChild(buildLeafPanel(m.id, leaf)));
  });
  renderSubNav(MAIN_TABS[0].id);
}

/* ---------- recalc ---------- */
function setText(id, text){ const e = document.getElementById(id); if(e) e.textContent = text; }

function recalcGroup(cfg, totals){
  cfg.cats.forEach(cat=>{
    let catTotal = 0;
    cfg.data.cats[cat].forEach(r=>{
      const dry = Number(r.dry)||0;
      const qty = Number(r.qty)||0;
      const p = pricing(dry, qty);
      setText('c_dry_'+cat+'_'+r.orig_row, fmt(dry));
      setText('c_vat_'+cat+'_'+r.orig_row, fmt(p.vatAmt));
      setText('c_inst_'+cat+'_'+r.orig_row, fmt(p.instAmt));
      setText('c_concept_'+cat+'_'+r.orig_row, fmt(p.concept));
      setText('c_prof_'+cat+'_'+r.orig_row, fmt(p.profAmt));
      setText('c_rate_'+cat+'_'+r.orig_row, fmt(p.unitRate));
      setText('c_total_'+cat+'_'+r.orig_row, fmt(p.total));
      rowTotalMap[cat+'_'+r.orig_row] = p.total;
      catTotal += p.total;
    });
    setText('tot_'+cat, fmt(catTotal));
    totals[cat] = catTotal;
  });

  let weldTotal = 0;
  const weldJoints = {};
  cfg.data.weld.forEach(r=>{
    const joints = jointCount(r);
    weldJoints[r.orig_row] = joints;
    const qpj = Number(r.qty_per_joint)||0;
    const kgqty = (joints*qpj)/1000;
    const dry = Number(r.dry)||0;
    const p = pricing(dry, kgqty);
    setText('c_joints_'+cfg.weldKind+'_'+r.orig_row, fmtInt(joints));
    setText('c_kgqty_'+cfg.weldKind+'_'+r.orig_row, kgqty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3}));
    setText('c_dry_'+cfg.weldKind+'_'+r.orig_row, fmt(dry));
    setText('c_vat_'+cfg.weldKind+'_'+r.orig_row, fmt(p.vatAmt));
    setText('c_inst_'+cfg.weldKind+'_'+r.orig_row, fmt(p.instAmt));
    setText('c_concept_'+cfg.weldKind+'_'+r.orig_row, fmt(p.concept));
    setText('c_prof_'+cfg.weldKind+'_'+r.orig_row, fmt(p.profAmt));
    setText('c_rate_'+cfg.weldKind+'_'+r.orig_row, fmt(p.unitRate));
    setText('c_total_'+cfg.weldKind+'_'+r.orig_row, fmt(p.total));
    rowTotalMap[cfg.weldKind+'_'+r.orig_row] = p.total;
    weldTotal += p.total;
  });
  setText('tot_'+cfg.weldKind, fmt(weldTotal));
  totals[cfg.weldKind] = weldTotal;

  let solvTotal = 0;
  cfg.data.solv.forEach((r,idx)=>{
    const wr = cfg.data.weld[idx];
    const joints = weldJoints[wr.orig_row];
    const qpj = (Number(wr.qty_per_joint)||0)/2;
    const kgqty = (joints*qpj)/1000;
    const dry = Number(r.dry)||0;
    const p = pricing(dry, kgqty);
    setText('qpj_'+cfg.solvKind+'_'+r.orig_row, qpj.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
    setText('c_joints_'+cfg.solvKind+'_'+r.orig_row, fmtInt(joints));
    setText('c_kgqty_'+cfg.solvKind+'_'+r.orig_row, kgqty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3}));
    setText('c_dry_'+cfg.solvKind+'_'+r.orig_row, fmt(dry));
    setText('c_vat_'+cfg.solvKind+'_'+r.orig_row, fmt(p.vatAmt));
    setText('c_inst_'+cfg.solvKind+'_'+r.orig_row, fmt(p.instAmt));
    setText('c_concept_'+cfg.solvKind+'_'+r.orig_row, fmt(p.concept));
    setText('c_prof_'+cfg.solvKind+'_'+r.orig_row, fmt(p.profAmt));
    setText('c_rate_'+cfg.solvKind+'_'+r.orig_row, fmt(p.unitRate));
    setText('c_total_'+cfg.solvKind+'_'+r.orig_row, fmt(p.total));
    rowTotalMap[cfg.solvKind+'_'+r.orig_row] = p.total;
    solvTotal += p.total;
  });
  setText('tot_'+cfg.solvKind, fmt(solvTotal));
  totals[cfg.solvKind] = solvTotal;

  let grand = 0;
  [...cfg.cats, cfg.weldKind, cfg.solvKind].forEach(k=>{ grand += totals[k]||0; setText('sum_'+k, fmt(totals[k]||0)); });
  setText(cfg.grandId, fmt(grand));
  return grand;
}

function recalcDiameterSummary(){
  const diaCost = {}, diaLen = {};
  DIAMS.forEach(d=>{ diaCost[d]=0; diaLen[d]=0; });

  function accumulate(cat, rows){
    rows.forEach(r=>{
      const d = normSize(r.size);
      if(diaCost.hasOwnProperty(d)) diaCost[d] += rowTotalMap[cat+'_'+r.orig_row]||0;
    });
  }
  CATS.forEach(cat=> accumulate(cat, DATA.cats[cat]));
  accumulate('Weld', DATA.weld);
  accumulate('Solv', DATA.solv);
  VALVE_CATS.forEach(cat=> accumulate(cat, VALVE_DATA.cats[cat]));
  accumulate('VWeld', VALVE_DATA.weld);
  accumulate('VSolv', VALVE_DATA.solv);

  DATA.cats['Pipe'].forEach(r=>{
    const d = normSize(r.size);
    if(diaLen.hasOwnProperty(d)) diaLen[d] += Number(r.qty)||0;
  });

  let grandDia = 0;
  DIAMS.forEach(d=>{
    const len = diaLen[d]||0;
    const cost = diaCost[d]||0;
    grandDia += cost;
    setText('dia_len_'+d, fmt(len));
    setText('dia_cost_'+d, fmt(cost));
    setText('dia_cpm_'+d, len>0 ? fmt(cost/len) : '—');
  });
  setText('dia_grandTotal', fmt(grandDia));
}

function recalcAll(){
  const totals = {};
  const pipeGrand = recalcGroup(GROUP_CFG.Pipe, totals);
  const valveGrand = recalcGroup(GROUP_CFG.Valve, totals);
  const grand = pipeGrand + valveGrand;

  recalcDiameterSummary();
  renderSummaryBar(totals, grand);
}

function renderSummaryBar(totals, grand){
  const bar = document.getElementById('summaryBar');
  bar.innerHTML = '';
  const pipeFittings = CATS.reduce((s,c)=>s+(totals[c]||0),0);
  const valveFittings = VALVE_CATS.reduce((s,c)=>s+(totals[c]||0),0);
  const weldSolv = (totals['Weld']||0)+(totals['Solv']||0)+(totals['VWeld']||0)+(totals['VSolv']||0);
  const cards = [
    {label:'Pipe &amp; Fittings Subtotal', value: pipeFittings},
    {label:'Valves &amp; Accessories Subtotal', value: valveFittings},
    {label:'Welding &amp; Solvent Subtotal', value: weldSolv},
    {label:'Grand Total', value: grand, grand:true},
  ];
  cards.forEach(c=>{
    const card = el('div',{class:'summary-card'+(c.grand?' grand':'')});
    const txt = el('div');
    txt.appendChild(el('div',{class:'label'}, c.label));
    txt.appendChild(el('div',{class:'value'}, fmt(c.value)+' EGP'));
    card.appendChild(txt);
    bar.appendChild(card);
  });
}

function styleSectionRow(ws, rowNum, span, text){

  cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.amber}};
  cell.alignment = {vertical:'middle', horizontal:'left', indent:1};
}
function styleDataRow(ws, rowNum, span, alt){
  for(let c=1;c<=span;c++){
    const cell = ws.getCell(rowNum,c);
    cell.border = {bottom:{style:'hair', color:{argb:CLR.border}}};
    if(alt) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.rowAlt}};
    cell.alignment = {vertical:'middle', horizontal: c<=3?'left':'center'};
  }
}
function styleTotalRow(ws, rowNum, span){
  for(let c=1;c<=span;c++){
    const cell = ws.getCell(rowNum,c);
    cell.font = {bold:true, color:{argb:CLR.navy}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.totalFill}};
    cell.border = {top:{style:'medium', color:{argb:CLR.amber}}};
  }
}

function computeGroupTotals(cfg){
  const rowTotal = {}, catTotals = {};
  cfg.cats.forEach(cat=>{
    let t=0;
    cfg.data.cats[cat].forEach(row=>{
      const total = pricing(Number(row.dry)||0, Number(row.qty)||0).total;
      rowTotal[cat+'_'+row.orig_row] = total;
      t += total;
    });
    catTotals[cat]=t;
  });
  let weldTotal=0;
  const weldJoints = {};
  cfg.data.weld.forEach(row=>{
    const joints=jointCount(row);
    weldJoints[row.orig_row]=joints;
    const kgqty=(joints*(Number(row.qty_per_joint)||0))/1000;
    const total = pricing(Number(row.dry)||0, kgqty).total;
    rowTotal[cfg.weldKind+'_'+row.orig_row] = total;
    weldTotal += total;
  });
  let solvTotal=0;
  cfg.data.solv.forEach((row,idx)=>{
    const wr=cfg.data.weld[idx];
    const joints=weldJoints[wr.orig_row];
    const qpj=(Number(wr.qty_per_joint)||0)/2;
    const kgqty=(joints*qpj)/1000;
    const total = pricing(Number(row.dry)||0, kgqty).total;
    rowTotal[cfg.solvKind+'_'+row.orig_row] = total;
    solvTotal += total;
  });
  return {rowTotal, catTotals, weldTotal, solvTotal};
}

async function exportExcel(){
  if(typeof ExcelJS === 'undefined'){ alert('Export library did not load. Check your internet connection.'); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Pipe Cost Engine';
  wb.created = new Date();

  /* ---- Price List sheets (Pipe + Valves) ---- */
  const plCols = [{header:'Item',width:18},{header:'Size',width:12},{header:'Unit',width:9},{header:'Dry Cost (EGP)',width:18}];
  function buildPriceListSheet(sheetName, title, cfg){
    const ws = wb.addWorksheet(sheetName, {properties:{tabColor:{argb:CLR.amber}}});
    ws.columns = plCols.map(c=>({width:c.width}));
    styleTitleRow(ws, 1, 4);
    ws.getCell(1,1).value = title;
    let r = 2;
    ws.getRow(r).values = plCols.map(c=>c.header);
    styleHeaderRow(ws, r, 4);
    r++;
    let alt=false;
    function plSection(t2){ styleSectionRow(ws, r, 4, t2); r++; alt=false; }
    function plRow(item, size, unit, dry){
      ws.getRow(r).values = [item, size, unit, dry];
      ws.getCell(r,4).numFmt = '#,##0.00';
      styleDataRow(ws, r, 4, alt);
      alt = !alt; r++;
    }
    cfg.cats.forEach(cat=>{ plSection(getCatLabel(cat)); cfg.data.cats[cat].forEach(row=> plRow(row.item||getCatLabel(cat), row.size, row.unit, row.dry)); });
    plSection('Welding (rod / fusion material)');
    cfg.data.weld.forEach(row=> plRow('Welding', row.size, 'kg', row.dry));
    plSection('Solvent Cement');
    cfg.data.solv.forEach(row=> plRow('Solvent', row.size, 'kg', row.dry));
    ws.views = [{state:'frozen', ySplit:2}];
  }
  buildPriceListSheet('Price List', 'MASTER PRICE LIST — Pipe & Fittings', GROUP_CFG.Pipe);
  buildPriceListSheet('Valve Price List', 'MASTER PRICE LIST — Valves & Accessories', GROUP_CFG.Valve);

  /* ---- Category sheets (Pipe + Valves) ---- */
  const catHeaders = ['Item','Size','Unit','Qty','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Total price'];
  const catWidths = [16,12,8,9,12,10,16,13,10,12,14];
  function buildCatSheet(cat, cfg){
    const ws = wb.addWorksheet(getCatLabel(cat).slice(0,31), {properties:{tabColor:{argb:CLR.navyLight}}});
    ws.columns = catWidths.map(w=>({width:w}));
    styleTitleRow(ws, 1, 11);
    ws.getCell(1,1).value = getCatLabel(cat).toUpperCase() + ' — Quantities & Pricing';
    ws.getRow(2).values = catHeaders;
    styleHeaderRow(ws, 2, 11);
    let rr = 3, a=false, total=0;
    cfg.data.cats[cat].forEach(row=>{
      const p = pricing(Number(row.dry)||0, Number(row.qty)||0);
      ws.getRow(rr).values = [row.item||'', row.size, row.unit, row.qty, row.dry, round2(p.vatAmt), round2(p.instAmt), round2(p.concept), round2(p.profAmt), round2(p.unitRate), round2(p.total)];
      for(const c of [5,6,7,8,9,10,11]) ws.getCell(rr,c).numFmt = '#,##0.00';
      styleDataRow(ws, rr, 11, a);
      a = !a; total += p.total; rr++;
    });
    ws.getCell(rr,10).value = 'TOTAL';
    ws.getCell(rr,11).value = round2(total);
    ws.getCell(rr,11).numFmt = '#,##0.00';
    styleTotalRow(ws, rr, 11);
    ws.views = [{state:'frozen', ySplit:2}];
  }
  CATS.forEach(cat=> buildCatSheet(cat, GROUP_CFG.Pipe));
  VALVE_CATS.forEach(cat=> buildCatSheet(cat, GROUP_CFG.Valve));

  /* ---- Welding / Solvent sheets (Pipe + Valves) ---- */
  const wsHeaders = ['Size','Qty per Joint (g)','Qty (kg)','N.o Joints','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Total price'];
  const wsWidths = [10,15,10,10,10,9,16,13,9,12,14];

  function buildWSSheet(name, rows, weldRowsForPairing, isWeld){
    const ws = wb.addWorksheet(name, {properties:{tabColor:{argb: isWeld?'FFC1453C':CLR.teal}}});
    ws.columns = wsWidths.map(w=>({width:w}));
    styleTitleRow(ws, 1, 11);
    ws.getCell(1,1).value = name.toUpperCase() + (isWeld ? ' (WELDON) — Fusion Joints & Pricing' : ' — Joints & Pricing');
    ws.getRow(2).values = wsHeaders;
    styleHeaderRow(ws, 2, 11);
    let rr = 3, a=false, total=0;
    rows.forEach((row, idx)=>{
      let joints, qpj;
      if(isWeld){ joints = jointCount(row); qpj = Number(row.qty_per_joint)||0; }
      else { const wr = weldRowsForPairing[idx]; joints = jointCount(wr); qpj = (Number(wr.qty_per_joint)||0)/2; }
      const kgqty = (joints*qpj)/1000;
      const p = pricing(Number(row.dry)||0, kgqty);
      ws.getRow(rr).values = [row.size, round2(qpj), round2(kgqty), joints, row.dry, round2(p.vatAmt), round2(p.instAmt), round2(p.concept), round2(p.profAmt), round2(p.unitRate), round2(p.total)];
      for(const c of [5,6,7,8,9,10,11]) ws.getCell(rr,c).numFmt = '#,##0.00';
      styleDataRow(ws, rr, 11, a);
      a = !a; total += p.total; rr++;
    });
    ws.getCell(rr,10).value = 'TOTAL';
    ws.getCell(rr,11).value = round2(total);
    ws.getCell(rr,11).numFmt = '#,##0.00';
    styleTotalRow(ws, rr, 11);
    ws.views = [{state:'frozen', ySplit:2}];
  }
  buildWSSheet('Welding', DATA.weld, null, true);
  buildWSSheet('Solvent', DATA.solv, DATA.weld, false);
  buildWSSheet('Valves Welding', VALVE_DATA.weld, null, true);
  buildWSSheet('Valves Solvent', VALVE_DATA.solv, VALVE_DATA.weld, false);

  /* ---- Summary sheet (Pipe + Valves combined) ---- */
  const pipeCalc = computeGroupTotals(GROUP_CFG.Pipe);
  const valveCalc = computeGroupTotals(GROUP_CFG.Valve);
  const wsS = wb.addWorksheet('Summary', {properties:{tabColor:{argb:CLR.amberDark}}});
  wsS.columns = [{width:28},{width:20}];
  styleTitleRow(wsS, 1, 2);
  wsS.getCell(1,1).value = 'SUMMARY — Total Costs by Category';
  wsS.getRow(2).values = ['Category','Total Price (EGP)'];
  styleHeaderRow(wsS, 2, 2);
  let rr = 3, grand = 0, a=false;
  function summarySection(title){ styleSectionRow(wsS, rr, 2, title); rr++; a=false; }
  function summaryRow(name, val){
    wsS.getRow(rr).values = [name, round2(val)];
    wsS.getCell(rr,2).numFmt = '#,##0.00';
    styleDataRow(wsS, rr, 2, a);
    a = !a; grand += val; rr++;
  }
  summarySection('PIPE & FITTINGS');
  CATS.forEach(cat=> summaryRow(getCatLabel(cat), pipeCalc.catTotals[cat]));
  summaryRow('Welding', pipeCalc.weldTotal);
  summaryRow('Solvent', pipeCalc.solvTotal);
  summarySection('VALVES & ACCESSORIES');
  VALVE_CATS.forEach(cat=> summaryRow(getCatLabel(cat), valveCalc.catTotals[cat]));
  summaryRow('Valves Welding', valveCalc.weldTotal);
  summaryRow('Valves Solvent', valveCalc.solvTotal);
  wsS.getCell(rr,1).value = 'GRAND TOTAL';
  wsS.getCell(rr,2).value = round2(grand);
  wsS.getCell(rr,2).numFmt = '#,##0.00';
  styleTotalRow(wsS, rr, 2);
  wsS.getCell(rr,1).font = {bold:true, size:12, color:{argb:CLR.navy}};
  wsS.getCell(rr,2).font = {bold:true, size:12, color:{argb:CLR.navy}};

  /* ---- Diameter Summary sheet ---- */
  const wsD = wb.addWorksheet('Diameter Summary', {properties:{tabColor:{argb:CLR.teal}}});
  wsD.columns = [{width:14},{width:18},{width:34},{width:20}];
  styleTitleRow(wsD, 1, 4);
  wsD.getCell(1,1).value = 'DIAMETER SUMMARY — Cost per Meter by Pipe Size';
  wsD.getRow(2).values = ['Diameter','Pipe Length (m)','Total Cost — Pipe+Fittings+Valves (EGP)','Cost / Meter (EGP/m)'];
  styleHeaderRow(wsD, 2, 4);
  const diaCost = {}, diaLen = {};
  DIAMS.forEach(d=>{ diaCost[d]=0; diaLen[d]=0; });
  function diaAccumulate(rowTotalSrc, cat, rows){
    rows.forEach(row=>{
      const d = normSize(row.size);
      if(diaCost.hasOwnProperty(d)) diaCost[d] += rowTotalSrc[cat+'_'+row.orig_row]||0;
    });
  }
  CATS.forEach(cat=> diaAccumulate(pipeCalc.rowTotal, cat, DATA.cats[cat]));
  diaAccumulate(pipeCalc.rowTotal, GROUP_CFG.Pipe.weldKind, DATA.weld);
  diaAccumulate(pipeCalc.rowTotal, GROUP_CFG.Pipe.solvKind, DATA.solv);
  VALVE_CATS.forEach(cat=> diaAccumulate(valveCalc.rowTotal, cat, VALVE_DATA.cats[cat]));
  diaAccumulate(valveCalc.rowTotal, GROUP_CFG.Valve.weldKind, VALVE_DATA.weld);
  diaAccumulate(valveCalc.rowTotal, GROUP_CFG.Valve.solvKind, VALVE_DATA.solv);
  DATA.cats['Pipe'].forEach(row=>{
    const d = normSize(row.size);
    if(diaLen.hasOwnProperty(d)) diaLen[d] += Number(row.qty)||0;
  });
  let drr = 3, aD=false, grandDia=0;
  DIAMS.forEach(d=>{
    const len = diaLen[d]||0, cost = diaCost[d]||0;
    const cpm = len>0 ? cost/len : null;
    wsD.getRow(drr).values = [d+' mm', round2(len), round2(cost), cpm!==null? round2(cpm): '—'];
    wsD.getCell(drr,2).numFmt = '#,##0.00';
    wsD.getCell(drr,3).numFmt = '#,##0.00';
    if(cpm!==null) wsD.getCell(drr,4).numFmt = '#,##0.00';
    styleDataRow(wsD, drr, 4, aD);
    aD = !aD; grandDia += cost; drr++;
  });
  wsD.getCell(drr,1).value = 'GRAND TOTAL';
  wsD.getCell(drr,3).value = round2(grandDia);
  wsD.getCell(drr,3).numFmt = '#,##0.00';
  styleTotalRow(wsD, drr, 4);
  wsD.views = [{state:'frozen', ySplit:2}];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const linkEl = document.createElement('a');
  linkEl.href = url; linkEl.download = 'Pipe_Valve_Costing.xlsx';
  document.body.appendChild(linkEl); linkEl.click(); document.body.removeChild(linkEl);
  URL.revokeObjectURL(url);
}

/* ---------- طباعة مختصرة: اخفاء الصفوف والتابات اللي مفيهاش قيم ---------- */
function markEmptyForPrint(){
  document.querySelectorAll('.tab-panel').forEach(function(panel){
    if(panel.id === 'panel_PriceList' || panel.id === 'panel_VPriceList') return; // دول متخفيين خالص بالـCSS
    var rows = panel.querySelectorAll('tbody tr');
    var anyVisible = false;
    rows.forEach(function(tr){
      tr.classList.remove('print-hide-row');
      if(tr.classList.contains('section-row')) return; // عناوين الأقسام (مش موجودة برا الـPriceList أصلاً)
      var totalEl = tr.querySelector('[id^="c_total_"], [id^="sum_"], [id^="dia_cost_"]');
      var val = totalEl ? (parseFloat((totalEl.textContent||'0').replace(/,/g,'')) || 0) : null;
      if(val !== null){
        if(Math.abs(val) < 0.005){
          tr.classList.add('print-hide-row');
        } else {
          anyVisible = true;
        }
      } else {
        anyVisible = true; // مفيش عمود إجمالي نقيس عليه، سيبه ظاهر احتياطاً
      }
    });
    panel.classList.toggle('print-hide-panel', rows.length > 0 && !anyVisible);
  });
}
window.addEventListener('beforeprint', markEmptyForPrint);

function printDoc(){
  markEmptyForPrint();
  window.print();
}

  document.getElementById('profInput').addEventListener('input', function(){ assump.prof = (Number(this.value)||0)/100; recalcAll(); });

}

document.addEventListener('DOMContentLoaded', init);
