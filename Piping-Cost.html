<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welding &amp; Solvent Costing</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --navy-900:#0A1B33; --navy-800:#12294A; --navy-700:#1C3A63; --navy-line:#2A4A78;
    --amber-500:#DFA355; --amber-600:#C4863A; --teal-500:#2AA9A0;
    --paper:#F5F6F8; --panel:#FFFFFF; --ink:#182233; --ink-soft:#5B6579;
    --line:#DDE2EA; --line-soft:#EBEEF3;
    --mono: ui-monospace, "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .app{max-width:1500px;margin:0 auto;padding:24px 20px 60px;}

  /* ---------- Animated gradient hero header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
    padding:26px 30px;border-radius:18px;color:#fff;
    background:linear-gradient(120deg,var(--navy-900),var(--navy-700),var(--teal-500),var(--amber-600),var(--navy-800));
    background-size:400% 400%;
    animation:gradientShift 14s ease infinite;
    box-shadow:0 10px 30px rgba(10,27,51,.28);
    position:relative;overflow:hidden;
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .brand-mark{width:50px;height:50px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .brand-text h1{margin:0;font-size:21px;letter-spacing:1.6px;color:#fff;font-weight:800;}
  .brand-text .subtitle{font-size:12.5px;color:rgba(255,255,255,.8);letter-spacing:.3px;}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:1;}

  .btn{
    border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);
    color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .btn:hover{background:rgba(255,255,255,.24);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.25);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:var(--amber-500);color:var(--navy-900);border-color:var(--amber-500);}
  .btn.primary:hover{background:var(--amber-600);color:#fff;}

  /* ---------- Summary cards ---------- */
  .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 20px;}
  .summary-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    border-top:4px solid var(--amber-500);display:flex;align-items:center;gap:12px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .summary-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(10,27,51,.12);}
  .summary-card.grand{border-top-color:var(--navy-900);background:linear-gradient(135deg,#FBF3E7,#FFF7EA);}
  .summary-card .icon{font-size:26px;line-height:1;}
  .summary-card .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:700;margin-bottom:4px;}
  .summary-card .value{font-size:19px;font-weight:800;color:var(--navy-900);font-family:var(--mono);}

  /* ---------- Assumptions bar ---------- */
  .assump-bar{
    display:flex;gap:24px;padding:16px 20px;border-radius:14px;margin-bottom:20px;flex-wrap:wrap;align-items:center;
    background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
    box-shadow:0 4px 14px rgba(10,27,51,.18);
  }
  .assump-field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--amber-500);margin-bottom:5px;font-weight:700;}
  .assump-field input{width:90px;background:rgba(255,255,255,.09);border:1px solid var(--navy-line);color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;font-family:var(--mono);}
  .assump-field input:focus{outline:2px solid var(--amber-500);outline-offset:1px;}
  .assump-note{color:#9FB0C8;font-size:12px;margin-left:auto;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap;
    background:var(--panel);padding:7px;border-radius:16px;border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(10,27,51,.05);
  }
  .tab-btn{
    border:none;background:transparent;padding:9px 15px;border-radius:11px;font-size:13px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;letter-spacing:.2px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .tab-btn:hover{background:var(--line-soft);color:var(--navy-900);}
  .tab-btn.active{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
    color:#fff;box-shadow:0 4px 10px rgba(10,27,51,.28);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .panel-toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .hint{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:0 2px 8px rgba(10,27,51,.05);max-height:70vh;}
  table{border-collapse:collapse;width:100%;min-width:760px;}
  thead th{background:var(--navy-900);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:10px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2;}
  thead th.left{text-align:left;padding-left:12px;}
  tbody td{padding:6px 6px;border-bottom:1px solid var(--line-soft);text-align:center;font-size:13px;}
  tbody tr:nth-child(even){background:#FAFBFD;}
  tbody tr:hover{background:#F1F5FB;}
  tbody tr.section-row td{background:linear-gradient(90deg,var(--amber-500),var(--amber-600));color:var(--navy-900);font-weight:800;text-align:left;padding-left:12px;text-transform:uppercase;font-size:11.5px;letter-spacing:.3px;}
  td.left{text-align:left;padding-left:10px;font-weight:700;color:var(--navy-900);white-space:nowrap;}
  input[type=number]{width:100%;min-width:66px;border:1px solid var(--amber-500);border-radius:7px;padding:5px 6px;font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--ink);background:#FFFBF3;transition:box-shadow .12s ease;}
  input[type=number]:focus{outline:none;box-shadow:0 0 0 3px rgba(223,163,85,.35);}
  .computed{font-family:var(--mono);color:var(--ink);}
  .computed.strong{font-weight:800;color:var(--navy-900);}
  tfoot td{background:#FBF3E7;font-weight:800;color:var(--navy-900);padding:9px 6px;text-align:center;font-family:var(--mono);border-top:2px solid var(--amber-500);}
  tfoot td.left{text-align:right;padding-right:14px;font-family:var(--sans);}

  footer.tool-footer{margin-top:26px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

  @media (max-width:720px){
    .summary-bar{grid-template-columns:1fr 1fr;}
    .topbar{flex-direction:column;align-items:flex-start;gap:14px;}
  }

/* ================= PRINT ================= */
@page{ size:landscape; margin:12mm; }
@media print{
  html,body{background:#fff;}
  .app{max-width:100%;padding:0;}

  /* اخفي أي حاجة مالهاش لازمة في الورق */
  .actions, .tabs, .panel-toolbar, .assump-note{display:none !important;}

  /* اطبع كل تاب كامل ورا التاني، مش بس الفاتح */
  .tab-panel{display:block !important;page-break-inside:avoid;break-inside:avoid;margin:0 0 22px;animation:none !important;}
  .tab-panel + .tab-panel{page-break-before:always;break-before:page;}

  /* الهيدر: يرجع لون ثابت بدل الجراديانت المتحرك (الأنيميشن مبيتطبعش أصلاً) */
  .topbar{
    background:var(--navy-900) !important;animation:none !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    box-shadow:none;border-radius:0;padding:14px 4px;margin-bottom:10px;
  }
  .assump-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:0;}
  .summary-card{box-shadow:none;break-inside:avoid;}

  /* الجداول: شيل السكرول عشان الجدول يطبع كامل مش بس الجزء الظاهر */
  .table-wrap{max-height:none !important;overflow:visible !important;border:1px solid #999;box-shadow:none;border-radius:0;}
  table{width:100%;min-width:0;}
  thead{display:table-header-group;} /* هيدر الأعمدة يتكرر في كل صفحة */
  tr{page-break-inside:avoid;break-inside:avoid;}
  thead th, tbody tr.section-row td, tfoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* خانات الإدخال: تتطبع كنص عادي مش كصندوق فاضي */
  input[type=number]{
    border:none !important;background:transparent !important;box-shadow:none !important;
    -webkit-appearance:none;appearance:none;padding:0;font-weight:700;color:var(--ink);
  }

  footer.tool-footer{display:none;}
}
  
</style>
</head>

  <nav class="tabs" id="tabsNav"></nav>

  <div id="panels"></div>

  <footer class="tool-footer">Created by: Eng. Hesham Mohamed</footer>
</div>

<script>
(function(){
"use strict";

let assump = {vat:0.14, inst:0.15, prof:0.25};

function fmt(n){ return (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return Math.round(Number(n)||0).toLocaleString(); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

/* ---------- lookups ---------- */
const rowByKey = {}; // key = cat+'_'+orig_row -> row object
CATS.forEach(cat=>{
  DATA.cats[cat].forEach(r=>{ rowByKey[cat+'_'+r.orig_row] = r; });
});
DATA.weld.forEach(r=>{ rowByKey['Weld_'+r.orig_row] = r; });
DATA.solv.forEach(r=>{ rowByKey['Solv_'+r.orig_row] = r; });

function qtyOf(cat, row){ return Number(rowByKey[cat+'_'+row].qty)||0; }

function jointCount(w){
  return w.contrib.reduce((sum,c)=> sum + c.coeff*qtyOf(c.cat, c.row), 0);
}

function pricing(dry, qty){
  const vatAmt = dry*assump.vat;
  const instAmt = dry*assump.inst;
  const concept = dry+vatAmt+instAmt;
  const profAmt = concept*assump.prof;
  const unitRate = concept+profAmt;
  const total = unitRate*qty;
  return {vatAmt, instAmt, concept, profAmt, unitRate, total};
}

/* ---------- DOM builders ---------- */
function el(tag, attrs, html){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function toolbar(text){
  const d = el('div',{class:'panel-toolbar'});
  d.appendChild(el('span',{class:'hint'}, text));
  return d;
}

  const trh = el('tr');

    tr.appendChild(el('td',{class:'left'}, r.size||''));
    tr.appendChild(el('td',{class:'left'}, r.unit||''));
    const qtyTd = el('td');
    const qtyInput = el('input',{type:'number',step:'1',id:'q_'+cat+'_'+r.orig_row,value:r.qty});
    qtyInput.addEventListener('input', function(){ r.qty = Number(this.value)||0; recalcAll(); });
    if(cat==='Pipe'){
      qtyInput.setAttribute('title','Rounds up to the nearest multiple of 6 (standard pipe length) when you finish typing.');
      qtyInput.addEventListener('blur', function(){
        const val = Number(this.value)||0;
        if(val>0){
          const rounded = Math.ceil(val/6)*6;
          this.value = rounded;
          r.qty = rounded;
          recalcAll();
        }
      });
      qtyInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ this.blur(); } });
    }
    qtyTd.appendChild(qtyInput);
    tr.appendChild(qtyTd);
    ['dry','vat','inst','concept','prof','rate','total'].forEach(f=>{
      tr.appendChild(el('td',{}, el('span',{class:'computed'+(f==='total'?' strong':''), id:'c_'+f+'_'+cat+'_'+r.orig_row}, '0.00').outerHTML));
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  const tfoot = el('tfoot');
  const trf = el('tr');
  trf.appendChild(el('td',{class:'left',colspan:'10'}, 'TOTAL'));
  trf.appendChild(el('td',{}, el('span',{id:'tot_'+cat}, '0.00').outerHTML));
  tfoot.appendChild(trf);
  table.appendChild(tfoot);
  wrap.appendChild(table);
  return wrap;
}

/* ---------- recalc ---------- */
function setText(id, text){ const e = document.getElementById(id); if(e) e.textContent = text; }

function recalcAll(){
  const totals = {};

  CATS.forEach(cat=>{
    let catTotal = 0;
    DATA.cats[cat].forEach(r=>{
      const dry = Number(r.dry)||0;
      const qty = Number(r.qty)||0;
      const p = pricing(dry, qty);
      setText('c_dry_'+cat+'_'+r.orig_row, fmt(dry));
      setText('c_vat_'+cat+'_'+r.orig_row, fmt(p.vatAmt));
      setText('c_inst_'+cat+'_'+r.orig_row, fmt(p.instAmt));
      setText('c_concept_'+cat+'_'+r.orig_row, fmt(p.concept));
      setText('c_prof_'+cat+'_'+r.orig_row, fmt(p.profAmt));
      setText('c_rate_'+cat+'_'+r.orig_row, fmt(p.unitRate));
      setText('c_total_'+cat+'_'+r.orig_row, fmt(p.total));
      catTotal += p.total;
    });
    setText('tot_'+cat, fmt(catTotal));
    totals[cat] = catTotal;
  });

  let weldTotal = 0;
  const weldJoints = {};
  DATA.weld.forEach(r=>{
    const joints = jointCount(r);
    weldJoints[r.orig_row] = joints;
    const qpj = Number(r.qty_per_joint)||0;
    const kgqty = (joints*qpj)/1000;
    const dry = Number(r.dry)||0;
    const p = pricing(dry, kgqty);
    setText('c_joints_Weld_'+r.orig_row, fmtInt(joints));
    setText('c_kgqty_Weld_'+r.orig_row, kgqty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3}));
    setText('c_dry_Weld_'+r.orig_row, fmt(dry));
    setText('c_vat_Weld_'+r.orig_row, fmt(p.vatAmt));
    setText('c_inst_Weld_'+r.orig_row, fmt(p.instAmt));
    setText('c_concept_Weld_'+r.orig_row, fmt(p.concept));
    setText('c_prof_Weld_'+r.orig_row, fmt(p.profAmt));
    setText('c_rate_Weld_'+r.orig_row, fmt(p.unitRate));
    setText('c_total_Weld_'+r.orig_row, fmt(p.total));
    weldTotal += p.total;
  });
  setText('tot_Weld', fmt(weldTotal));
  totals['Weld'] = weldTotal;

  let solvTotal = 0;
  DATA.solv.forEach((r,idx)=>{
    const wr = DATA.weld[idx];
    const joints = weldJoints[wr.orig_row];
    const qpj = (Number(wr.qty_per_joint)||0)/2;
    const kgqty = (joints*qpj)/1000;
    const dry = Number(r.dry)||0;
    const p = pricing(dry, kgqty);
    setText('qpj_solv_'+r.orig_row, qpj.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
    setText('c_joints_Solv_'+r.orig_row, fmtInt(joints));
    setText('c_kgqty_Solv_'+r.orig_row, kgqty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3}));
    setText('c_dry_Solv_'+r.orig_row, fmt(dry));
    setText('c_vat_Solv_'+r.orig_row, fmt(p.vatAmt));
    setText('c_inst_Solv_'+r.orig_row, fmt(p.instAmt));
    setText('c_concept_Solv_'+r.orig_row, fmt(p.concept));
    setText('c_prof_Solv_'+r.orig_row, fmt(p.profAmt));
    setText('c_rate_Solv_'+r.orig_row, fmt(p.unitRate));
    setText('c_total_Solv_'+r.orig_row, fmt(p.total));
    solvTotal += p.total;
  });
  setText('tot_Solv', fmt(solvTotal));
  totals['Solv'] = solvTotal;

  let grand = 0;
  [...CATS,'Weld','Solv'].forEach(k=>{ grand += totals[k]||0; setText('sum_'+k, fmt(totals[k]||0)); });
  setText('grandTotal', fmt(grand));

  renderSummaryBar(totals, grand);
}

/* ---------- styled Excel export (ExcelJS) ---------- */
const CLR = {
  navy:'FF0A1B33', navyLight:'FF1C3A63', amber:'FFDFA355', amberDark:'FFC4863A',
  white:'FFFFFFFF', rowAlt:'FFF7F9FC', totalFill:'FFFBF3E7', border:'FFDDE2EA', teal:'FF2AA9A0'
};

function styleTitleRow(ws, rowNum, span){
  ws.mergeCells(rowNum,1,rowNum,span);
  const cell = ws.getCell(rowNum,1);
  cell.font = {bold:true, size:14, color:{argb:CLR.white}};
  cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.navy}};
  cell.alignment = {vertical:'middle', horizontal:'center'};
  ws.getRow(rowNum).height = 28;
}
function styleHeaderRow(ws, rowNum, span){
  for(let c=1;c<=span;c++){
    const cell = ws.getCell(rowNum,c);
    cell.font = {bold:true, size:10.5, color:{argb:CLR.white}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.navyLight}};
    cell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
    cell.border = {bottom:{style:'thin', color:{argb:CLR.border}}};
  }
  ws.getRow(rowNum).height = 26;
}
function styleSectionRow(ws, rowNum, span, text){
  ws.mergeCells(rowNum,1,rowNum,span);
  const cell = ws.getCell(rowNum,1);
  cell.value = text;
  cell.font = {bold:true, size:10.5, color:{argb:CLR.navy}};
  cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.amber}};
  cell.alignment = {vertical:'middle', horizontal:'left', indent:1};
}
function styleDataRow(ws, rowNum, span, alt){
  for(let c=1;c<=span;c++){
    const cell = ws.getCell(rowNum,c);
    cell.border = {bottom:{style:'hair', color:{argb:CLR.border}}};
    if(alt) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.rowAlt}};
    cell.alignment = {vertical:'middle', horizontal: c<=3?'left':'center'};
  }
}
function styleTotalRow(ws, rowNum, span){
  for(let c=1;c<=span;c++){
    const cell = ws.getCell(rowNum,c);
    cell.font = {bold:true, color:{argb:CLR.navy}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:CLR.totalFill}};
    cell.border = {top:{style:'medium', color:{argb:CLR.amber}}};
  }
}

async function exportExcel(){
  if(typeof ExcelJS === 'undefined'){ alert('Export library did not load. Check your internet connection.'); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Welding & Solvent Costing';
  wb.created = new Date();

  /* ---- Price List sheet ---- */
  const plCols = [{header:'Item',width:18},{header:'Size',width:12},{header:'Unit',width:9},{header:'Dry Cost (EGP)',width:18}];
  const ws0 = wb.addWorksheet('Price List', {properties:{tabColor:{argb:CLR.amber}}});
  ws0.columns = plCols.map(c=>({width:c.width}));
  styleTitleRow(ws0, 1, 4);
  ws0.getCell(1,1).value = 'MASTER PRICE LIST — Welding & Solvent Costing';
  let r = 2;
  ws0.getRow(r).values = plCols.map(c=>c.header);
  styleHeaderRow(ws0, r, 4);
  r++;
  let alt=false;
  function plSection(title){ styleSectionRow(ws0, r, 4, title); r++; alt=false; }
  function plRow(item, size, unit, dry){
    ws0.getRow(r).values = [item, size, unit, dry];
    ws0.getCell(r,4).numFmt = '#,##0.00';
    styleDataRow(ws0, r, 4, alt);
    alt = !alt; r++;
  }
  CATS.forEach(cat=>{ plSection(cat); DATA.cats[cat].forEach(row=> plRow(row.item||cat, row.size, row.unit, row.dry)); });
  plSection('Welding (rod / fusion material)');
  DATA.weld.forEach(row=> plRow('Welding', row.size, 'kg', row.dry));
  plSection('Solvent Cement');
  DATA.solv.forEach(row=> plRow('Solvent', row.size, 'kg', row.dry));
  ws0.views = [{state:'frozen', ySplit:2}];

  /* ---- Category sheets ---- */
  const catHeaders = ['Item','Size','Unit','Qty','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Total price'];
  const catWidths = [16,12,8,9,12,10,16,13,10,12,14];
  CATS.forEach(cat=>{
    const ws = wb.addWorksheet(cat, {properties:{tabColor:{argb:CLR.navyLight}}});
    ws.columns = catWidths.map(w=>({width:w}));
    styleTitleRow(ws, 1, 11);
    ws.getCell(1,1).value = cat.toUpperCase() + ' — Quantities & Pricing';
    ws.getRow(2).values = catHeaders;
    styleHeaderRow(ws, 2, 11);
    let rr = 3, a=false, total=0;
    DATA.cats[cat].forEach(row=>{
      const p = pricing(Number(row.dry)||0, Number(row.qty)||0);
      ws.getRow(rr).values = [row.item||'', row.size, row.unit, row.qty, row.dry, round2(p.vatAmt), round2(p.instAmt), round2(p.concept), round2(p.profAmt), round2(p.unitRate), round2(p.total)];
      for(const c of [5,6,7,8,9,10,11]) ws.getCell(rr,c).numFmt = '#,##0.00';
      styleDataRow(ws, rr, 11, a);
      a = !a; total += p.total; rr++;
    });
    ws.getCell(rr,10).value = 'TOTAL';
    ws.getCell(rr,11).value = round2(total);
    ws.getCell(rr,11).numFmt = '#,##0.00';
    styleTotalRow(ws, rr, 11);
    ws.views = [{state:'frozen', ySplit:2}];
  });

  /* ---- Welding / Solvent sheets ---- */
  const wsHeaders = ['Size','Qty per Joint (g)','Qty (kg)','N.o Joints','Dry cost','Vat','Install & Transport','Concept cost','Profit','Unit rate','Total price'];
  const wsWidths = [10,15,10,10,10,9,16,13,9,12,14];

  function buildWSSheet(name, rows, isWeld){
    const ws = wb.addWorksheet(name, {properties:{tabColor:{argb: isWeld?'FFC1453C':CLR.teal}}});
    ws.columns = wsWidths.map(w=>({width:w}));
    styleTitleRow(ws, 1, 11);
    ws.getCell(1,1).value = name.toUpperCase() + (isWeld ? ' (WELDON) — Fusion Joints & Pricing' : ' — Joints & Pricing');
    ws.getRow(2).values = wsHeaders;
    styleHeaderRow(ws, 2, 11);
    let rr = 3, a=false, total=0;
    rows.forEach((row, idx)=>{
      let joints, qpj;
      if(isWeld){ joints = jointCount(row); qpj = Number(row.qty_per_joint)||0; }
      else { const wr = DATA.weld[idx]; joints = jointCount(wr); qpj = (Number(wr.qty_per_joint)||0)/2; }
      const kgqty = (joints*qpj)/1000;
      const p = pricing(Number(row.dry)||0, kgqty);
      ws.getRow(rr).values = [row.size, round2(qpj), round2(kgqty), joints, row.dry, round2(p.vatAmt), round2(p.instAmt), round2(p.concept), round2(p.profAmt), round2(p.unitRate), round2(p.total)];
      for(const c of [5,6,7,8,9,10,11]) ws.getCell(rr,c).numFmt = '#,##0.00';
      styleDataRow(ws, rr, 11, a);
      a = !a; total += p.total; rr++;
    });
    ws.getCell(rr,10).value = 'TOTAL';
    ws.getCell(rr,11).value = round2(total);
    ws.getCell(rr,11).numFmt = '#,##0.00';
    styleTotalRow(ws, rr, 11);
    ws.views = [{state:'frozen', ySplit:2}];
  }
  buildWSSheet('Welding', DATA.weld, true);
  buildWSSheet('Solvent', DATA.solv, false);

  /* ---- Summary sheet ---- */
  const wsS = wb.addWorksheet('Summary', {properties:{tabColor:{argb:CLR.amberDark}}});
  wsS.columns = [{width:24},{width:20}];
  styleTitleRow(wsS, 1, 2);
  wsS.getCell(1,1).value = 'SUMMARY — Total Costs by Category';
  wsS.getRow(2).values = ['Category','Total Price (EGP)'];
  styleHeaderRow(wsS, 2, 2);
  let rr = 3, grand = 0, a=false;
  const catTotals = {};
  CATS.forEach(cat=>{
    let t=0; DATA.cats[cat].forEach(row=> t += pricing(Number(row.dry)||0, Number(row.qty)||0).total);
    catTotals[cat]=t;
  });
  let weldTotal=0; DATA.weld.forEach(row=>{ const joints=jointCount(row); const kgqty=(joints*(Number(row.qty_per_joint)||0))/1000; weldTotal += pricing(Number(row.dry)||0, kgqty).total; });
  let solvTotal=0; DATA.solv.forEach((row,idx)=>{ const wr=DATA.weld[idx]; const joints=jointCount(wr); const qpj=(Number(wr.qty_per_joint)||0)/2; const kgqty=(joints*qpj)/1000; solvTotal += pricing(Number(row.dry)||0, kgqty).total; });
  [...CATS.map(c=>[c,catTotals[c]]), ['Welding',weldTotal], ['Solvent',solvTotal]].forEach(([name,val])=>{
    wsS.getRow(rr).values = [name, round2(val)];
    wsS.getCell(rr,2).numFmt = '#,##0.00';
    styleDataRow(wsS, rr, 2, a);
    a = !a; grand += val; rr++;
  });
  wsS.getCell(rr,1).value = 'GRAND TOTAL';
  wsS.getCell(rr,2).value = round2(grand);
  wsS.getCell(rr,2).numFmt = '#,##0.00';
  styleTotalRow(wsS, rr, 2);
  wsS.getCell(rr,1).font = {bold:true, size:12, color:{argb:CLR.navy}};
  wsS.getCell(rr,2).font = {bold:true, size:12, color:{argb:CLR.navy}};

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const linkEl = document.createElement('a');
  linkEl.href = url; linkEl.download = 'Welding_Solvent_Costing.xlsx';
  document.body.appendChild(linkEl); linkEl.click(); document.body.removeChild(linkEl);
  URL.revokeObjectURL(url);
}

  document.getElementById('profInput').value = round2(assump.prof*100);
  document.getElementById('vatInput').addEventListener('input', function(){ assump.vat = (Number(this.value)||0)/100; recalcAll(); });
  document.getElementById('instInput').addEventListener('input', function(){ assump.inst = (Number(this.value)||0)/100; recalcAll(); });
  document.getElementById('profInput').addEventListener('input', function(){ assump.prof = (Number(this.value)||0)/100; recalcAll(); });

  initTabsAndPanels();
  recalcAll();

  document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
  document.getElementById('printBtn').addEventListener('click', printDoc);
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
